# Extra legroom, decided 2026-11-01. Ryan and Krysta both need it.
legroom:
  requirement: Main Cabin with extra legroom, exit row or the row just fore or aft of it
  options:
    - id: comfort_paid
      what: Buy Delta Comfort Classic on both long legs
      surcharge_usd_per_person: 174   # 80 on the outbound, 94 on the return
      gives: extra legroom, normal armrests, priority boarding
    - id: preferred_free
      what: Buy Main Classic and use the Silver complimentary Preferred Seat benefit
      surcharge_usd_per_person: 0
      gives: >
        Exit row at no charge. On the A319 Delta Comfort is rows 10 to 13 and
        the exit row sits behind it at row 15, sold as Preferred Seating
        rather than Comfort, and Silver gets Preferred free.
      watch: >
        Exit rows have fixed armrests, which costs hip width even as it gains
        legroom. Confirm row numbers on the live seat map at booking: the
        A321neo layouts vary by configuration and the third-party seat maps
        disagree with each other.
  decided: 2026-11-01
  chosen: comfort_paid
  why: >
    Comfort Classic was taken on both legs rather than gambling on a free exit
    row. Two reasons beat the saving. The Silver complimentary companion
    upgrade is limited to U.S. 50 flights, so on a Mexico route it would have
    seated one of them in Comfort and left the other in Main. And exit rows
    have fixed armrests, which costs hip width on a four hour flight for two
    people who need the room. Bought outright, both get legroom and normal
    armrests, with priority boarding thrown in.
  still_to_do: >
    Pick the actual seats. Comfort Classic allows seat selection at any time,
    so this does not have to happen at purchase, but two together beats
    whatever gets auto-assigned. Comfort is rows 10 to 13 on the A319.

# Why the two long legs go on one ticket rather than two.
open_jaw:
  shape: DTW to MEX on 2026-12-29, CUN to DTW on 2027-01-08, one ticket
  decided: 2026-11-01
  outcome: taken, in Delta Comfort Classic
  price_status: quoted
  source: delta.com multi-city, priced and booked in the same session
  prices_for_two_usd:
    comfort_classic_dl646_dl1911: 3096.54   # what was paid
    comfort_classic_dl646_dl618: 2996       # 1:50pm return, rejected on timing
    main_classic_cheapest_combination: 2422
    two_one_ways_main_classic: 2908
    two_one_ways_comfort_classic: 3255
  saving_usd: 158
  saving_note: >
    Against the same cabin bought as two one-ways, 3,255, the open jaw saved
    158. It is not the 486 that the Main Classic headline suggested, because
    that figure was Delta's "From" teaser and assumed a connecting return.
  also_gains: >
    One record for both legs, so a delay or cancellation on the outbound is
    Delta's to reaccommodate rather than two unrelated tickets.
  teaser_trap: >
    Delta advertises the multi-city fare as "From" a figure that pairs the
    chosen outbound with the cheapest available return, which was a connection
    through Atlanta. The real nonstop to nonstop total was 177 per person
    higher. Read the cumulative total on the second segment screen, not the
    headline on the first.
  deep_link_warning: >
    Delta's multi-city search cannot be reached by URL. tripType=MULTI_CITY
    silently falls back to the booking form with Round Trip selected, though
    paxCount does carry through. One-way deep links do work. The form has to
    be built by hand for multi-city.

# What a single booking will and will not sell, checked 2026-11-01.
# Every passenger added to one booking prices the whole booking at the
# highest bucket reached, so large parties pay the worst fare for everyone.
party_size_ceiling:
  dtw_mex_2026_12_29_nonstop:
    1: 890
    2: 890
    4: 1056
    5: not sold
    6: not sold
    7: not sold
  cun_dtw_2027_01_08_nonstop:
    2: 564
    6: not sold
  mex_cun_2027_01_03_aeromexico:
    2: 176
    3: 176
    4: 176
    6: 176
  conclusion: >
    The group cannot be put on one Delta nonstop in one transaction. Book in
    pairs against the same flight numbers, Ryan and Krysta first. The Mexico
    City to Cancun hop is the only leg that holds its fare at six.
  method_caveat: >
    A flight vanishing from results means the search could not sell the whole
    party in one fare class. It is not proof the seats are physically gone.
    Delta may still sell six across mixed buckets at a higher fare, so check
    delta.com before telling the group a flight is unavailable.

# Silver Medallion, read off delta.com 2026-11-01.
medallion_silver:
  useful:
    - >
      First checked bag free each way on the Delta legs, for both travellers.
      Worth 182 across the two of them on this itinerary.
    - >
      The bag waiver extends to up to 8 companions on the Medallion member's
      own reservation. It does not justify putting the group on one booking:
      the fare bucket jump costs 166 per person to save 45.
    - Complimentary Preferred Seats, which is the free route to the exit row.
  not_useful:
    - >
      The complimentary companion upgrade is limited to U.S. 50 flights, so it
      does not cover Krysta on a Mexico route. The free upgrade path seats one
      of them in Comfort, not both. This is the argument for buying Comfort.
    - >
      Complimentary Delta Comfort seat access clears 24 hours before
      departure. Do not count on it in holiday week.
  not_a_risk: >
    Basic Economy is not in play. delta.com offered no Basic fare on DL 646,
    and the ladder starts at Main Classic, which already includes free seat
    selection and free changes on the outbound.

