afternoon_departure_problem: >
  The stated preference cannot be met on the outbound. Mexico City is 4h50
  nonstop and 7 to 8 hours connecting, so every afternoon departure from
  Detroit lands between 21:50 and 01:15. Checked flying out 28 December
  instead: same result, plus an extra Airbnb night. Decision is to keep the
  08:40 nonstop, because 29 December is one of only two free evenings in
  Mexico City and trading it for $728 per person is a poor deal.

