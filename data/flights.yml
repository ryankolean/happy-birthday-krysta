# Repriced live on delta.com and Google Flights 2026-11-01. Nothing booked.
# Delta is the preferred carrier. The group holds Silver Medallion.
#
# The September prices are kept in price_history below, because the two long
# legs moved in opposite directions and the net is a saving.

status: partly booked
status_detail: >
  Ryan and Krysta booked both long legs on 2026-11-01 as one Delta multi-city
  record in Delta Comfort Classic: DL 646 outbound and DL 1911 home. Nobody
  else has booked, and the Mexico City to Cancun leg is not bought for anyone.
  Who is on what is tracked in data/flight-tracker.yml.
priced: 2026-11-01
priced_previously: 2026-09-25
preference: nonstop only, early to mid afternoon departures where possible

flights:
  - id: out
    date: 2026-12-29
    route: DTW to MEX
    carrier: Delta
    number: DL 646
    aircraft: Airbus A319
    stops: 0
    depart: "08:40"
    arrive: "12:30"
    duration: 4h50
    price_usd: 890
    price_status: quoted
    fare: Delta Main Classic
    first_checked_bag_usd: 45
    who: all 7
    booked_by: >
      Ryan and Krysta, 2026-11-01, in Delta Comfort Classic rather than Main,
      on the same multi-city record as DL 1911. The 890 above is the Main
      Classic one-way reference fare, not what they paid. What they paid is in
      data/flight-tracker.yml.
    inventory: >
      delta.com showed "2 left at this price" on 2026-11-01 in both Main and
      Comfort, and Ryan and Krysta took the two Comfort seats. That is the fare
      bucket, not the aircraft, so the flight does not disappear for the rest
      of the group, the price steps up. The next bucket priced at 1056 per
      person in Main when the same search was run for four passengers, so
      anyone still booking should expect to pay more than 890.
    risk: >
      Exactly one nonstop per day on roughly 130 seats, in holiday week.
      Seat availability is the real risk, not fare. See party_size_ceiling:
      this flight will not sell to a party of five or more in one booking.

  - id: to_beach
    date: 2027-01-03
    route: MEX to CUN
    carrier: Aeromexico
    number: AM 536
    stops: 0
    depart: "14:55"
    arrive: "18:36"
    terminals: departs MEX Terminal 2, arrives CUN Terminal 4
    price_usd: 260.25
    price_status: quoted
    repriced: 2026-11-03
    repriced_note: >
      Re-checked on aeromexico.com on 3 November, the day the hosts ticketed
      it. Every fare on this departure was identical to 2 days earlier, to the
      cent. The fare has not moved since it was first recorded, so the figure
      below is current rather than merely recent.
    hosts_ticketed: >
      Krysta and Ryan bought this leg on 3 November 2026 at 260.25 each,
      520.50 for the two, on exactly the fare recommended here. The flight is
      confirmed and ticketed. On the ticket the cabin reads Premium Economy,
      fare class W, which is what AM Plus is called in the booking system.
      Everyone else on the beach leg still has to book. Match the flight
      number and the fare, not just the time.
      Record locator, ticket numbers and seats are in
      private/aeromexico-mex-cun-booking.md and stay there.
    fare: AM Plus Classic, one checked bag and an AM Plus seat included
    who: the 6 continuing to the beach
    decided: 2026-11-01
    includes: >
      One checked bag up to 55 lb, an AM Plus seat with extra legroom, free
      seat selection, and changes allowed for a fee. Nothing in this figure is
      estimated. 260.25 is the whole fare per person, quoted on aeromexico.com
      and identical at 1, 2 and 6 passengers.
    why_this_fare: >
      It is the cheapest fare Aeromexico sells on this route that includes a
      checked bag at all. Main Basic is 223.15 and needs a bag bought
      separately for roughly 27, about 250 all in, which puts AM Plus Classic
      about 10 per person above it. For that 10 it removes the bag estimate,
      adds extra legroom and adds seat selection. It is the same trade the
      group already took in paying for Delta Comfort on the long legs.
    for_the_hosts: >
      Krysta and Ryan both hold Delta Silver Medallion, which is SkyTeam
      Elite, and that carries one extra checked bag on Aeromexico in its own
      right. So for the two of them the bag is covered either way, and AM
      Plus Classic is bought for the extra-legroom seat rather than for the
      bag. It costs 17.40 each more than Main Classic at 242.85. They chose
      it on 2 November. The reasoning above still stands for anyone in the
      group without status, which is most of them.
    why_the_time_moved: >
      The plan was the 13:55 until 1 November. AM Plus is not sold on that
      departure at any passenger count, nor on the 08:55: the column reads
      "Not available". The 14:55 is the first departure after the 11:00
      checkout that sells it. The cost is one hour. The group lands 18:36
      instead of 17:36 and reaches Puerto Morelos around 19:15, which is still
      a reasonable arrival for a leg with nothing scheduled on it.
    fare_correction: >
      This line was wrong twice, both times because it was priced somewhere
      other than Aeromexico. The 176 was the Light fare, which carries no
      checked bag and no carry-on at all, not even a bin item. The 222 that
      replaced it came off a Google Flights ladder that does not match what
      Aeromexico sells: it put Basic at 195 and claimed Flex bundles a checked
      bag. Priced direct on 2026-11-01, Basic is 223.15 and no Main Cabin
      fare includes a checked bag, Flex included. Price this leg on
      aeromexico.com and nowhere else.
    note: >
      No Delta option exists. Delta does not fly Mexican domestic routes and
      delta.com refuses the route outright: searching MEX to CUN for this date
      returns "we do not fly this route on the selected day" (ROF4002_409).
      It must be bought from Aeromexico direct or through an agency. This
      corrects the earlier plan to ticket it as a DL-coded codeshare through
      delta.com for SkyMiles credit, which is not possible.
      Aeromexico runs this roughly hourly 06:01 to 22:05. Every departure
      prices the same and the fare is identical at 1, 2 and 6 passengers, so
      there is no party-size ceiling here of the kind the Delta legs have.
      What does vary by departure is which fare families are sold at all.
      Avoid Viva and Volaris, which fly it from NLU, an hour plus north of
      Roma Norte.
    the_date_is_the_expensive_part: >
      The departure time does not move the price but the date does. Sunday
      3 January is the peak of the week at 199.95 for the cheapest fare,
      against 151.25 on 1 and 2 January and 159.35 on 4 January. The trip
      cannot use the cheaper days: Casa KM checkout is the morning of the 3rd.
      Noted so nobody reads a 151 quote elsewhere and thinks they are being
      overcharged.
    am_plus_ladder_usd:           # per person, aeromexico.com, 2026-11-01, the 14:55
      basic: 235.95               # no checked bag
      classic: 260.25             # one checked bag, AM Plus seat, the one booked
      flex: 331.05                # adds free changes
    rejected_main_cabin:
      why: >
        Main Cabin was the plan until the fares were read properly. Not one of
        its four fares includes a checked bag. Every row of the comparison
        reads "Checked baggage 55 lb, Additional charge", Flex included, which
        is what the earlier 262 claim got wrong. That makes the real Main
        Cabin price 223.15 plus a bag, and at that point AM Plus Classic is
        10 more and strictly better.
      ladder_usd:                 # per person, the 14:55, re-checked 2026-11-03
        light: 199.95             # carry-on is an additional charge, no checked bag
        basic: 223.15             # carry-on and personal item, no checked bag
        classic: 242.85           # bigger carry-on, standard seat selection, no checked bag
        flex: 302.05              # unlimited changes, still no checked bag
        premier: 320.65
    do_not_count_on_status: >
      Ryan's Silver Medallion is SkyTeam Elite, which normally adds a bag on
      SkyTeam carriers, but Aeromexico excludes class V Basic purchases on
      domestic, US and Canadian routes from Club Premier, SkyTeam and Delta
      member benefits. The status buys nothing on this leg either way, which
      is one more reason to take a fare that includes the bag outright.
    watch: >
      With AM Plus Classic there is no baggage money anywhere in this trip.
      Silver covers the first checked bag each way on both Delta legs, and the
      Aeromexico fare includes one. If anybody downgrades to Main Basic to
      save 10, the bag comes back at roughly 27 and has to be bought online
      before check-in, because it costs more at the airport.

