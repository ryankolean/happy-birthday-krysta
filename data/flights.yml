exchange_rate_fixed: >
  Resolved 2026-11-01. data/trip.yml carried 17.0 MXN/USD from September. The
  peso and dollar prices delta.com and Google Flights showed for the same CUN
  to DTW seats implied about 18.78, and live quotes that day agreed at 18.78
  to 18.79. trip.yml and budget.yml now both carry 18.79.
  The blast radius turned out to be one line. Nothing in the build converts
  currency, so only figures computed by hand from a peso price were wrong,
  and the Pujol lunch is the only price in this trip quoted to us in pesos.
  It fell from 223 to 202 per person. The New Year's Eve figures were never
  an exchange rate problem: they are stale because they are 2023 prices.

