# Everything is per person. Lodging also carries the unit price, because a
# house and a resort residence are booked whole and then split.
#
# status: booked   = paid or held on a real confirmation
#         quoted   = live price seen on the operator's own site
#         estimate = real market price for a comparable thing, not quoted for us
#         open     = not decided, figure is a placeholder
#
# THE RULE ON THIS PAGE: only booked and quoted lines go into a total.
# Estimates are shown so nobody is surprised on the ground, and they are
# deliberately left out of every total, because the totals are the amount
# each person owes Ryan. See estimates_note.

currency: USD
rate_mxn_per_usd: 17.0
priced: 2026-10-02
lodging_repriced: 2026-10-28

estimates_note: >
  Every total on this page counts only the lines marked booked or quoted.
  Lines marked estimate are never added in. Those are things you will pay
  for yourself on the ground, in cash or on your own card, and the figure is
  there so the week does not surprise anybody. The totals are a different
  thing: they are what you owe Ryan, because he fronted the bookings on one
  card and everybody settles up with him.

flights:
  status: own_arrangement
  note: >
    The fares below were priced on Google Flights on 25 September 2026 and are
    there as a reference point, not as a bill. They will have moved.
  krysta_and_ryan: >
    Krysta and Ryan have not bought theirs yet. When they do, the exact
    flights will be listed here so anybody who wants to travel together can
    book the same ones.
  mex_cun_callout: >
    The one worth coordinating is Mexico City to Cancun on 3 January.
    Everybody continuing to the beach is on that leg, and being on the same
    aircraft means one arrival, one transfer and one van from the airport
    instead of six people trickling in. Aeromexico runs it hourly at a flat
    fare, so the time is a group decision rather than a price decision.
    If you are coming to the beach, say so before anybody ticketing starts.
  reference_fares_usd:
    dtw_mex_29_dec: 1246
    mex_cun_3_jan: 184
    cun_dtw_8_jan: 493
    mex_dtw_3_jan_nonstop: 1893

cdmx:
  travelers: 7
  lodging_travelers: 6
  group_shape: 2 couples and 2 singles share the accommodation
  lodging_note: >
    Seven people are in Mexico City, but only six share the accommodation: two
    couples and two singles. The seventh books their own hotel, so the lodging
    line splits 6 ways while every other line below is a seven person trip.
  lines:
    - item: Casa KM, 4BR penthouse, Del Valle Norte, 5 nights
      per_person: 639
      unit_price: 3837
      unit_label: whole flat, 5 nights, split 6 ways
      status: booked
      verified: 2026-10-18
      note: >
        Booked 18 October on Ryan's card. $3,836.93 all in: $634.20 a night
        for 5 nights plus $665.91 of tax. Split 6 ways that is $639.49 each.
        Paid $1,585.51 on booking with $2,251.42 scheduled for 14 December.
        The nightly rate rose about 29 percent between the 12 October quote of
        $2,944 and booking, which is $148 more per person than this page used
        to carry.

    - item: Birthday lunch at Pujol, 2 January
      per_person: 223
      unit_price: 1563
      unit_label: table of 7, food only
      status: booked
      verified: 2026-10-27
      note: >
        Booked 23 October for 14:30, a table for seven in the main dining
        room. Ryan's card is on the booking and will take the whole bill on
        the day, so this is one of the amounts you settle with him.
        The menu is MX$3,795 with VAT included, which is $223.24 at 17.0
        MXN/USD, or about $1,563 across seven. Drinks and tip are on top and
        are not in this figure. Budget $200 to $250 for the food and expect
        to add to it.
        Nothing was charged at booking. The card is a guarantee only, and the
        reservation is free to change or cancel online until 14:30 on
        1 January. Inside that 24 hours a cancellation, a no-show, a date
        change or a reduction in the diner count all cost MX$2,000 per person.

    - item: Lucha libre with El Taco Club, 29 December
      per_person: 102
      unit_price: 716
      unit_label: whole group of 7, paid in full
      status: booked
      verified: 2026-10-27
      note: >
        Booked and paid in full on 23 October on Ryan's card. The receipt
        reads $88.12 a head across 7 for $616.84, plus $98.69 of tax, so
        $715.53 all in and $102.22 each. Re-checked against the Airbnb
        confirmation on 27 October and the figure is exact.
        Attraction tickets, a full meal, specialty drinks and a mask are all
        included, so this line covers the 29 December dinner as well as the
        show. Free cancellation until 28 December.

  per_person: 964

  # Shown, never totalled. See estimates_note at the top of this file.
  estimates:
    - item: New Year's Eve
      per_person: 0
      status: open
      note: >
        Nothing to pay and nothing booked. The plan is to eat in at Casa KM,
        with everybody bringing a dish or a bottle to share, or to walk out
        to whatever is open if the mood changes on the day. This replaces the
        $324 placeholder that used to sit here, which was the St. Regis gala
        price and was never anybody's plan.

    - item: Casual dinners and drinks, 2 nights
      per_person: 138
      status: estimate

    - item: Taco day, 30 December
      per_person: 40
      status: estimate
      note: Replaces the Sabores food tour, which would have been about $115 each.

    - item: Museums and city transport
      per_person: 50
      status: estimate
      note: >
        Basing in Del Valle Norte keeps a lot of the itinerary walkable, but
        Polanco and the centre are a car ride.

  estimates_per_person: 228

riviera:
  travelers: 6
  group_shape: 2 couples and 2 singles
  property: Dreams Jade Resort & Spa, Puerto Morelos
  board: all-inclusive
  recommended_build: >
    Four rooms at Dreams Jade, every one a Junior Suite with Ocean View, on
    the flexible rate. Both couples take an Ocean View King and each single
    takes an Ocean View King on the single-occupancy rate. Everybody has
    their own room, everybody has the same room, and all four sit in the same
    ocean view buildings.
  room_plan: >
    The fourth room is what costs money here, not the view. Three rooms would
    put the two singles together in a Junior Suite Two Double, which is two
    separate beds and breaks no rule, at $966 each. Giving each single their
    own room costs $534 more each. Upgrading a couple from a standard suite
    to Ocean Front costs $244. The expensive decision is privacy and the
    cheap one is the water.
    Four reservations are four independent prices, so one couple buying up
    does not raise anybody else's rate. What mixing categories does cost is
    adjacency, because Ocean Front rooms sit nearest the water and standard
    Junior Suites are set back. Putting everybody in one category fixes that
    for $89 each over buying one couple an Ocean Front.
  lines:
    - item: Four Ocean View Junior Suites, flexible rate, all-inclusive
      per_person: 1509
      unit_price: 9055
      unit_label: four rooms, 5 nights, split 6 ways
      status: quoted
      verified: 2026-10-28
      note: >
        Priced live on Booking.com on 28 October for 3 to 8 January. Two
        Ocean View Kings at $2,515 each and two on the single-occupancy rate
        at $2,013 each, so $9,055 across six is $1,509 each.
        These figures have 16% VAT added on top of what Booking displays.
        Booking quotes this property pre-tax: it prints "Included: City tax"
        and "Excluded: 16% VAT". The displayed total is $7,806. Do not read
        the Booking number as the bill. This is the opposite of The Fives,
        whose engine quoted tax-inclusive and which earlier planning wrongly
        grossed up.
        Nothing is booked. The non-refundable rate is $1,284 each, $225
        cheaper, and refunds nothing from the moment it is taken. Flexible is
        the call while the build is unsettled.
        Food is not a separate line any more. This rate is all-inclusive and
        covers meals, drinks and gratuities, which is why the $324 village
        food estimate that sat under The Fives has gone.

  per_person: 1509

  # Every arrangement in which all six get a bed of their own and nobody is on
  # a sofa. Mirrors combinations in data/lodging.yml.
  layout_options:
    - id: three_base
      label: Three rooms, all standard Junior Suite
      units: 3
      sleeps: Both singles share a room but not a bed, two full beds, one each
      nonrefundable_total: 5684
      nonrefundable_per_person: 947
      flexible_total: 6689
      flexible_per_person: 1115
      verdict: >
        The cheapest thing that breaks no rule, and $394 each below the
        recommendation. What it gives up is a private room for each single
        and a view for anybody.
    - id: three_a_ocean_front
      label: Three rooms, one couple Ocean Front
      units: 3
      sleeps: Singles still share a room, Krysta and Ryan move to the water
      nonrefundable_total: 6171
      nonrefundable_per_person: 1029
      flexible_total: 7259
      flexible_per_person: 1210
      verdict: >
        The birthday couple carry the whole upgrade at $1,181 each and
        everybody else pays less than in any four-room build.
    - id: four_base
      label: Four rooms, all standard Junior Suite
      units: 4
      sleeps: A room each for both couples and both singles
      nonrefundable_total: 6751
      nonrefundable_per_person: 1125
      flexible_total: 7946
      flexible_per_person: 1324
      verdict: >
        Privacy for everyone and a view for no one. The two singles carry the
        whole cost of the fourth room at $1,764 each on the flexible rate.
    - id: four_a_ocean_view
      label: Four rooms, one couple Ocean View
      units: 4
      sleeps: Krysta and Ryan get the view, everybody else a standard suite
      nonrefundable_total: 7016
      nonrefundable_per_person: 1169
      flexible_total: 8252
      flexible_per_person: 1375
      verdict: >
        The cheapest way to get the birthday couple a view. $132 each to
        them, nothing to anybody else.
    - id: four_a_ocean_front
      label: Four rooms, one couple Ocean Front
      units: 4
      sleeps: Krysta and Ryan at the water's edge, everybody else set back
      nonrefundable_total: 7238
      nonrefundable_per_person: 1206
      flexible_total: 8517
      flexible_per_person: 1420
      verdict: >
        The fallback if the group will not carry the ocean view build. The
        four rooms are not in the same buildings.
    - id: four_couples_ocean_view
      label: Four rooms, both couples Ocean View
      units: 4
      sleeps: Both couples get the view, neither single does
      nonrefundable_total: 7280
      nonrefundable_per_person: 1213
      flexible_total: 8558
      flexible_per_person: 1426
      verdict: >
        The one arrangement here that is visibly unequal, and it costs only
        $83 each less than giving everybody the same room. Hard to justify.
    - id: four_a_pc_ocean_front
      label: Four rooms, one couple Preferred Club Ocean Front
      units: 4
      sleeps: Krysta and Ryan get the water plus the private lounge
      nonrefundable_total: 7497
      nonrefundable_per_person: 1250
      flexible_total: 8824
      flexible_per_person: 1471
      verdict: >
        Top of the realistic ladder for one couple, $1,311 each, and still
        $38 each below giving the whole group an ocean view.
    - id: four_all_ocean_view
      label: Four rooms, everybody Ocean View
      units: 4
      sleeps: The same room for all six, a private one each, same buildings
      nonrefundable_total: 7702
      nonrefundable_per_person: 1284
      flexible_total: 9055
      flexible_per_person: 1509
      recommended: true
      verdict: >
        The most expensive build on this list and still the one to take. It
        is $89 each above buying one couple an Ocean Front, and it removes
        both awkward conversations: nobody has a better room than anybody
        else and the whole group is in the same buildings.

  single_occupancy_trap: >
    Dreams Jade discounts a solo traveller to 80 percent of the two-person
    rate on the four cheapest room types and to 100 percent of it on
    everything above them. From Preferred Club Tropical View upward,
    including every Ocean Front and every Preferred Club room, one person
    pays the full two-person price for a guest who is not there.
    So the singles go in an Ocean View room or below, and never in an Ocean
    Front or a Preferred Club room. Verified at one adult and at six adults
    across four rooms on 28 October.

  estimates:
    - item: CUN airport transfer, round trip
      per_person: 25
      status: estimate
      note: >
        A private van for the whole group runs roughly $55 to $137 each way
        depending on operator, so about $150 round trip at the middle of that
        range, or $25 each at six. This holds only if everyone is on the same
        Mexico City to Cancun flight. The resort has been asked whether they
        run their own private transfer, which would be the cleaner answer.

  estimates_per_person: 25

  board_included:
    note: >
      The rate is all-inclusive, so meals, drinks and gratuities are in it.
      That is why the beach leg no longer carries a food estimate. Under The
      Fives this page added $324 each for eating in Puerto Morelos village on
      top of a room-only rate.
      Judge the two properties on total outlay rather than on the lodging
      line. The Fives came to $1,435 each once food and the transfer were
      counted. Dreams Jade on the recommended build is $1,534 on the flexible
      rate and $1,309 on the non-refundable one. So the flexible build is $99
      each more than The Fives and buys a private room for every person, an
      ocean view for every person, and no decisions about dinner.

per_person:
  both_legs: 2473      # 964 city + 1509 beach
  city_only: 964
  note: >
    These are what you owe Ryan, not what the trip costs you. Flights are
    yours to book and pay for, and the estimate lines above are money you
    will spend on the ground rather than hand to him.

excludes:
  - flights, which everyone books and pays for themselves
  - personal spending
  - travel insurance
  - tips beyond the quoted dinners
  - anything bought on the ground

split_mechanism:
  - Ryan fronts the shared bookings on one card and everybody settles with him.
  - Lodging is the only line billed as a whole. Both legs are split evenly by head.
  - Keep the two legs on separate ledgers. Guests who leave after Mexico City should not carry beach costs.
  - Flights never go through this. Book your own and pay for your own.
  - Pujol goes on Ryan's card on the day. Food is the figure on this page, drinks and tip are settled after.
  - Note who fronts which booking and how they are repaid
  - Splitwise or similar, agreed up front

non_refundable_exposure:
  - what: Casa KM Airbnb, booked 18 October
    terms: >
      Committed. $1,585.51 already paid, $2,251.42 due 14 December, and only a
      partial refund until 16:00 on 22 December. Nothing after that.
  - what: Lucha libre with El Taco Club, booked 23 October
    terms: >
      Paid $715.53 in full on booking. Fully refundable until 28 December,
      nothing after that.
  - what: Pujol, booked 23 October for 2 January
    terms: >
      Nothing paid, the card is only a guarantee. Free to change or cancel
      online until 14:30 on 1 January 2027. Inside that 24 hours, MX$2,000 per
      person applies to a cancellation, a no-show, a date change or a cut to
      the diner count, which is about $824 across seven.
  - what: Dreams Jade, flexible rate
    terms: >
      Nothing booked. The flexible rate refunds in full; the exact deadline
      is confirmed at booking rather than published on the search page, so
      get it in writing. The non-refundable rate is $225 cheaper each and
      refunds nothing from the moment it is taken.
      Unlike every other line here, the exposure runs toward booking rather
      than away from it. Four rooms over New Year week on the Riviera Maya is
      the inventory everybody wants, and the build is still unpicked, so
      flexible is what lets the group decide without paying for the delay.

flag_for_solo_b: >
  One traveller flies home after Mexico City rather than continuing to the
  beach. They owe $964 and none of the $1,509 beach line, and they book their
  own flights like everybody else. Worth knowing before they ticket: the
  3 January Mexico City to Detroit nonstop was $1,893 one way when it was
  priced, while connections the same day ran $774 to $956.
