excludes:
  - personal spending
  - travel insurance
  - tips beyond the quoted dinners
  - anything bought on the ground

split_mechanism:
  - Agree a per-person target before booking
  - Keep the two legs on separate ledgers. Guests who leave after Mexico City should not carry beach costs.
  - Anyone joining only for the beach should not carry New Year's Eve.
  - Under room-only, food is individual rather than prepaid. Agree up front whether meals go on one card and get split, or people pay their own.
  - Note who fronts which booking and how they are repaid
  - Splitwise or similar, agreed up front

non_refundable_exposure:
  - what: Oasis Airbnb
    terms: Free 24 hours, then partial refund only until 22 December 2026
  - what: The Fives, flexible rate
    terms: Free cancellation, refundable until 13 December 2026
  - what: Pujol, if booked
    terms: MX$2,000 per person, 48 hour window
  - what: New Year's Eve galas
    terms: Typically prepaid
  - what: Balloon
    terms: Volare cancels free to 48 hours. Weather cancellations are refundable with no fee.

flag_for_couple_b: >
  The two leaving after Mexico City pay $4,741 each, almost as much as the six
  doing the whole eleven days, because the MEX to DTW Delta nonstop is $1,893
  one way. Connections that day run $774 to $956. Taking one saves about
  $1,040 each and brings them to roughly $3,700.
