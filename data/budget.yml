riviera:
  travelers: 6
  group_shape: 2 couples and 2 singles
  property: Dreams Jade Resort & Spa, Puerto Morelos
  board: all-inclusive
  recommended_build: >
    DECIDED 2 November 2026, and nothing below reopens it. Four rooms at
    Dreams Jade, every one a Junior Suite with Ocean View, every one with a
    King bed, booked direct with the resort. Two rooms for the two couples,
    one each for the two single travellers, all four requested adjacent. Both couples take an Ocean View King and
    each single takes an Ocean View King on the single-occupancy rate.
    Everybody has their own room, everybody has the same room, and all four
    sit in the same ocean view buildings.
    The resort confirmed on 2 November that this is not just the nicer build
    but the only one that can be kept together: all four rooms must be in the
    same category to have any chance of being assigned near each other. Every
    mixed-category option below therefore buys a scattered group.
  room_plan: >
    Settled. Four rooms, four Kings, same category, requested adjacent.
    The reasoning is kept below because it is why the number is what it is.
    The fourth room is what costs money here, not the view. Three rooms would
    put the two singles together in a Junior Suite Two Double, which is two
    separate beds and breaks no rule, at $966 each. Giving each single their
    own room costs $534 more each. Upgrading a couple from a standard suite
    to Ocean Front costs $244. The expensive decision is privacy and the
    cheap one is the water.
    Four reservations are four independent prices, so one couple buying up
    does not raise anybody else's rate. What mixing categories does cost is
    adjacency, because Ocean Front rooms sit nearest the water and standard
    Junior Suites are set back. Putting everybody in one category fixes that
    for $89 each over buying one couple an Ocean Front.
  lines:
    - item: Four Ocean View Junior Suites, booked direct, all-inclusive
      per_person: 1403
      unit_price: 8420
      unit_label: four rooms, 5 nights, split 6 ways
      status: quoted
      verified: 2026-11-02
      supersedes: the 1509 Booking.com figure carried from 28 October
      note: >
        Written quote from the Dreams Jade reservations desk on 2 November,
        in reply to the enquiry sent on 30 October. This is the first beach
        figure on this trip that was quoted to us rather than read off a
        search page.
        Two rooms at double occupancy are $468 a night and two at single
        occupancy are $374, over five nights, so $2,340 and $1,870 a room and
        $8,420 across four. Split 6 ways that is $1,403 each.
        Food, drinks, taxes and gratuities are all in the rate. Nothing is
        added to this number at the resort, so unlike the Booking.com figures
        it does not get multiplied by 1.16. Do not gross this up.
        It lands between the two Booking rates: $634 below the flexible rate
        at $9,055 and $715 above the non-refundable at $7,705. The resort
        declined to match Booking, saying its rates are public and net. The
        $715 buys a cancellation policy better than either, so it is worth
        paying. See non_refundable_exposure at the foot of this file.
        Nothing is booked yet.

  per_person: 1403

  # DECIDED 2 November 2026: even split, $1,403 each. Kept because the
  # alternative is the first thing anybody will ask about.
  split_question:
    convention: >
      This repo splits lodging evenly by head and always has. Every figure in
      layout_options below is a whole-group total divided by six, and the
      Casa KM line works the same way. On that convention the beach leg is
      $1,403 each and the per_person figure above is right.
    the_alternative: >
      Four reservations are four separate prices, and the quote prices them
      separately: $2,340 for a room with two people in it and $1,870 for a
      room with one. Charging each room what it actually costs gives $1,170
      a head for the four people in couples and $1,870 for each single.
    what_it_moves: >
      $233 per person. Against an even split each of the four people in a
      couple pays $233 more than their room costs and each single pays $467
      less than theirs does. Across the two singles that is $933, which is
      exactly what the four coupled travellers put in.
      So the even split is the couples buying each single most of a private
      room. That was invisible while the beach leg was one undifferentiated
      $9,055, and the itemised quote is what made it visible.
    worth_knowing: >
      The single rate is 80 percent of the double, not 50. A solo traveller
      already pays for 1.6 people, because the room is the room and only the
      all-inclusive board scales with the head in it. So a single taking a
      private room is not getting a cheap deal under the per-room split
      either: they would pay $1,870 for what costs a couple $1,170 a head.
      Both splits are defensible and neither is a trick.
    decided: even split, 2026-11-02
    decided_by: Ryan
    why: >
      The convention held. One number for all six is what goes to the group,
      and the four coupled travellers absorb $933 between them so that
      Christian and Bubba are not billed extra for private rooms that were
      decided on their behalf. It is also the only version of this that fits
      in a group message without a table.
      The per-room alternative stays recorded above because it is the first
      thing somebody will ask about, and the answer should be that it was
      considered and declined rather than missed.

