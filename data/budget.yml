# Everything is per person. Lodging also carries the unit price, because a
# house and a resort residence are booked whole and then split.
#
# status: booked   = paid or held on a real confirmation
#         quoted   = live price seen on the operator's own site
#         estimate = real market price for a comparable thing, not quoted for us
#         open     = not decided, figure is a placeholder
#
# THE RULE ON THIS PAGE: only booked and quoted lines go into a total.
# Estimates are shown so nobody is surprised on the ground, and they are
# deliberately left out of every total, because the totals are the amount
# each person owes Ryan. See estimates_note.

currency: USD
rate_mxn_per_usd: 18.79    # corrected 2026-11-01, was 17.0. See trip.yml.
priced: 2026-10-02
lodging_repriced: 2026-10-28

estimates_note: >
  Every total on this page counts only the lines marked booked or quoted.
  Lines marked estimate are never added in. The totals are what you owe Ryan,
  because he fronted the bookings on one card and everybody settles up with
  him.
  There are two kinds of estimate here and they are not the same thing.
  The estimates blocks are money you spend yourself on the ground, in cash or
  on your own card, and the figure is there so the week does not surprise
  anybody. The owed_estimates block is money that lands on Ryan's card and
  that you will therefore owe him, but which cannot be pinned to a number
  yet. Only one line is in it: drinks and tip at Pujol, because the
  restaurant has no pairing and the bill depends on what the table orders.
  Keeping it out of the total is the rule working correctly, not an oversight.
  Treating the total as the final Pujol number is the mistake to avoid.

