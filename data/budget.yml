      nonrefundable_total: 7280
      nonrefundable_per_person: 1213
      flexible_total: 8558
      flexible_per_person: 1426
      verdict: >
        The one arrangement here that is visibly unequal, and it costs only
        $83 each less than giving everybody the same room. Hard to justify.
    - id: four_a_pc_ocean_front
      label: Four rooms, one couple Preferred Club Ocean Front
      units: 4
      sleeps: Krysta and Ryan get the water plus the private lounge
      nonrefundable_total: 7497
      nonrefundable_per_person: 1250
      flexible_total: 8824
      flexible_per_person: 1471
      verdict: >
        Top of the realistic ladder for one couple, $1,311 each, and still
        $38 each below giving the whole group an ocean view.
    - id: four_all_ocean_view
      label: Four rooms, everybody Ocean View
      units: 4
      sleeps: The same room for all six, a private one each, same buildings
      nonrefundable_total: 7702
      nonrefundable_per_person: 1284
      flexible_total: 9055
      flexible_per_person: 1509
      direct_total: 8420
      direct_per_person: 1403
      recommended: true
      decided: 2026-11-02
      verdict: >
        The only row here with a real quote behind it, and the one taken on
        2 November.
        Booked direct it is $8,420 rather than the $9,055 Booking wanted, so
        $1,403 each rather than $1,509. It removes both awkward
        conversations: nobody has a better room than anybody else and the
        whole group is in the same buildings.
        It is also now the only row that can deliver that. The resort
        confirmed on 2 November that all four rooms must be in one category
        for the front desk to even attempt to seat the group together, so
        every cheaper mixed-category row above buys a group scattered across
        the property.

  single_occupancy_trap: >
    Dreams Jade discounts a solo traveller to 80 percent of the two-person
    rate on the four cheapest room types and to 100 percent of it on
    everything above them. From Preferred Club Tropical View upward,
    including every Ocean Front and every Preferred Club room, one person
    pays the full two-person price for a guest who is not there.
    So the singles go in an Ocean View room or below, and never in an Ocean
    Front or a Preferred Club room. Verified at one adult and at six adults
    across four rooms on 28 October, and confirmed from the resort's own desk
    on 2 November: they quoted $374 against $468, which is 20.09 percent. The
    rule was worked out from a search page and has now been checked against
    the operator, which is the order this repo is supposed to do things in.

  estimates:
    - item: CUN airport transfer, round trip
      per_person: 16.67
      status: quoted
      verified: 2026-11-03
      unit_price: 100
      unit_label: one private van, both directions, split 6 ways
      supersedes: the 25 estimate carried from 2 November
      note: >
        Quoted on eTransfers' own site for the real dates, 3 to 8 January,
        at six passengers: a Toyota Hiace class van seating 8 with room for 8
        bags, private and never shared, at $94 round trip for the vehicle on
        the Economy fare or $100 on Premium. Take Premium. The $6 buys free
        cancellation up to 24 hours before pickup, and nothing about the
        beach leg is booked yet.
        $100 across six is $16.67 each, against the $25 this line carried as
        an estimate. The price is per vehicle rather than per person, it is
        the same whatever time the flight lands, and taxes, tolls and luggage
        are in it. Holiday week did not move it: the same $94 shows for a
        random November date.
        This holds only while all six are on one flight, which they are:
        AM 536, landing 18:36. Split the group across arrivals and this
        becomes two vans and roughly double.
        The resort runs no transfer of its own. Its authorised operator is
        AMSTAR, whose details are in private/jade-quote.md and who publishes
        no rate anywhere. Worth one email for a quote, but do not assume it
        wins: an in-house operator rarely beats the kerb, and the reports
        that do exist put AMSTAR well above this.
        Uber is not an option at this airport. See docs/transport.md.

    - item: Quintana Roo state tourist tax
      per_person: 15
      per_person_range: 14 to 28
      status: estimate
      note: >
        Visitax, the state levy on foreign visitors. Paid once per person for
        the stay rather than per night, and payable online before travel.
        The resort was asked and its answer does not settle it. It said the
        quoted rates include all applicable taxes and that no additional
        payments are required unless you use extra services. That is about
        the hotel bill. Visitax is paid to the state of Quintana Roo and not
        to the hotel, so the resort can be entirely right and this can still
        be owed by every person on the beach leg.
        No 2027 figure is published. Recent reporting puts it around 285 MXN,
        which is $15 at 18.79, with some sources still quoting 259. It is
        indexed to the UMA, so it moves every year. Travellers paying at
        Cancun airport in December 2025 reported being charged 525 MXN, about
        $28, against 285 in town, and the state has since said it is
        reviewing how the tax is collected. Pay it online in advance on the
        official state portal rather than at the airport desk.
        Re-check the real 2027 figure in December before anybody travels.

  estimates_per_person: 31.67

  board_included:
    note: >
      The rate is all-inclusive, so meals, drinks and gratuities are in it.
      That is why the beach leg carries no food estimate. The earlier
      room-only plan for this leg added $324 each on top of the lodging line
      for eating in Puerto Morelos village.
      Judge this on total outlay rather than on the lodging line alone. On the
      direct quote the recommended build is $1,434.67 each all in, which is
      $1,403 of room plus $16.67 of transfer and $15 of Visitax, against $1,435
      for the room-only plan it replaced. So it is $8 each more than the plan
      it beat, and it buys a private room and an ocean view for every person,
      all meals and drinks, and no decisions about dinner for five days.
      This read $1,534 against the Booking flexible rate until the direct
      quote landed on 2 November.

per_person:
  both_legs: 2346      # 943 city + 1403 beach
  city_only: 304       # shared events and meals only, no lodging
  city_only_was: 964
  add_for_pujol_drinks: 80
  add_for_pujol_drinks_note: >
    Neither total includes drinks and tip at Pujol, which go on Ryan's card
    and are therefore owed to him. They are an estimate, and the rule on this
    page is that estimates never enter a total, so they sit alongside it
    instead. Plan on about 80 more per person than the figures above.
  city_only_correction: >
    This line read 964 until 1 November 2026, which charged the one person
    doing the city alone for a Casa KM bed they are not sleeping in. They
    book their own room, so they owe the shared events and meals and nothing
    else. The lodging line has always split 6 ways; only this summary was
    wrong, and it was wrong by 639.
  note: >
    These are what you owe Ryan, not what the trip costs you. Flights are
    yours to book and pay for, and the estimate lines above are money you
    will spend on the ground rather than hand to him.

excludes:
  - flights, which everyone books and pays for themselves
  - personal spending
  - travel insurance
  - tips beyond the quoted dinners
  - anything bought on the ground

split_mechanism:
  - Ryan fronts the shared bookings on one card and everybody settles with him.
  - Lodging is the only line billed as a whole. Both legs are split evenly by head.
  - >
    Settled on 2 November for the beach leg too: even split, $1,403 each.
    Dreams Jade is four reservations at two different rates, so an even split
    moves $233 a head from the four coupled travellers to the two singles.
    That was chosen deliberately rather than overlooked, so that nobody is
    billed extra for a private room decided on their behalf. Working in
    riviera.split_question.
  - Keep the two legs on separate ledgers. Guests who leave after Mexico City should not carry beach costs.
  - Flights never go through this. Book your own and pay for your own.
  - Pujol goes on Ryan's card on the day. Food is the figure on this page, drinks and tip are settled after.
  - Note who fronts which booking and how they are repaid
  - Splitwise or similar, agreed up front

