  status: own_arrangement
  note: >
    The fares below were repriced on delta.com and Google Flights on
    1 November 2026 and are there as a reference point, not as a bill. They
    will have moved. The outbound dropped 356 per person since September and
    the Cancun return rose 71. Only two seats were left at the quoted
    outbound fare on 1 November, so this leg rewards booking early.
  krysta_and_ryan: >
    Krysta and Ryan are booked on all three legs. DL 646 out of Detroit at
    08:40 on 29 December, landing in Mexico City at 12:30. AM 536 out of
    Mexico City at 14:55 on 3 January, landing in Cancun at 18:36. DL 1911 out
    of Cancun at 15:15 on 8 January, landing in Detroit at 19:12. All three
    nonstop. If you want to travel together, those are the three to match.
    The Cancun hop was ticketed on 3 November at 260.25 each on AM Plus
    Classic, which is the fare this site recommends. Nothing about it is a
    guess any more.
    Fair warning on the outbound: they took the last two seats in the cheapest
    bucket, so it is now about $1,056 rather than the $890 they paid for the
    equivalent Main fare. The flights page has the current reference figures
    for every leg.
  mex_cun_callout: >
    The one worth coordinating is Mexico City to Cancun on 3 January.
    Everybody continuing to the beach is on that leg, and being on the same
    aircraft means one arrival, one transfer and one van from the airport
    instead of six people trickling in. Aeromexico runs it hourly at a flat
    fare, so the time is a group decision rather than a price decision.
    If you are coming to the beach, say so before anybody ticketing starts.
  reference_fares_usd:
    dtw_mex_29_dec: 1056          # the 890 bucket is gone, this is the floor now
    mex_cun_3_jan: 260.25         # AM Plus Classic on the 14:55, bag included
    cun_dtw_8_jan: 564
    mex_dtw_3_jan_nonstop: 1893   # not repriced, and nobody needs it any more
  duplication_warning: >
    These four numbers are a second copy of the fares in data/flights.yml and
    they have already gone stale once. Read them from flights.yml instead and
    delete this block the next time the flights section is touched.

