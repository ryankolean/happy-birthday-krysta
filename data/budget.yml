# Everything is per person. Lodging also carries the unit price, because a
# house and a resort residence are booked whole and then split.
#
# status: quoted   = live price seen on the operator's own site
#         estimate = real market price for a comparable thing, not quoted for us
#         open     = not decided, figure is a placeholder

currency: USD
rate_mxn_per_usd: 17.0
priced: 2026-10-02
lodging_repriced: 2026-10-12

flights:
  per_person_full_trip: 1923
  per_person_city_only: 3139
  status: quoted
  note: Priced on Google Flights 2026-09-25. See data/flights.yml for each leg.

cdmx:
  travelers: 7
  lodging_travelers: 6
  group_shape: 2 couples and 2 singles share the accommodation
  lodging_note: >
    Seven people are in Mexico City, but only six share the accommodation: two
    couples and two singles. The seventh books their own hotel, so the lodging
    line splits 6 ways while every other line below is a seven person trip.
  lines:
    - item: Casa KM, 4BR penthouse, Del Valle Norte, 5 nights
      per_person: 639
      unit_price: 3837
      unit_label: whole flat, 5 nights, split 6 ways
      status: booked
      verified: 2026-10-18
      note: >
        Booked 18 October. $3,836.93 all in: $634.20 a night for 5 nights plus
        $665.91 of tax. Split 6 ways that is $639.49 each. Paid $1,585.51 on
        booking with $2,251.42 scheduled for 14 December. The nightly rate rose
        about 29 percent between the 12 October quote of $2,944 and booking,
        which is $148 more per person than the figure this page carried.

    - item: New Year's Eve
      per_person: 324
      status: open
      note: >
        Placeholder is the St. Regis gala at MX$5,500 per adult, the only one of
        the three galas with a published price. The private chef approach works
        out to about $69 each plus a holiday premium, and the potluck approach
        about $31 to $69 each. See docs/nye.md. Expect this line to fall sharply.

    - item: Birthday lunch at Pujol, 2 January
      per_person: 223
      unit_price: 1563
      unit_label: table of 7, before drinks and tip
      status: booked
      verified: 2026-10-23
      note: >
        Booked 23 October for 14:30, a table for seven in the main dining
        room. The figure did not move: MX$3,795 per person with VAT included,
        which is $223.24 at 17.0 MXN/USD, or about $1,563 across seven. Drinks
        and tip are on top and are not in this line.
        Nothing was charged at booking. The card is a guarantee only, and the
        reservation is free to change or cancel online until 14:30 on
        1 January. Inside that 24 hours a cancellation, a no-show, a date
        change or a reduction in the diner count all cost MX$2,000 per person.
        The eight tasting menu minimum that broke this at seven applies to the
        private dining room, not to a regular table, so a normal table avoided
        it. That also means there is no private room and no wasted eighth
        cover. See docs/dining.md.

    - item: Lucha libre with El Taco Club, 29 December
      per_person: 102
      unit_price: 716
      unit_label: whole group of 7
      status: booked
      verified: 2026-10-23
      note: >
        Booked 23 October and paid in full. $88.12 a head across 7 is $616.84,
        plus $98.69 of tax, so $715.53 all in or $102.22 each. Attraction
        tickets, a full meal, specialty drinks and a mask are included, so this
        line covers the 29 December dinner as well as the show. That is why the
        $125 Ling Ling estimate it replaces is gone rather than moved. Free
        cancellation until 28 December. The tax was absent from Airbnb's date
        picker and appeared only at checkout, so the $616.84 figure quoted
        during the search was $98.69 light.

    - item: Casual dinners and drinks, 2 nights
      per_person: 138
      status: estimate

    - item: Taco day, 30 December
      per_person: 40
      status: estimate
      note: Replaces the Sabores food tour, which would have been about $115 each.

    - item: Museums and city transport
      per_person: 50
      status: estimate
      note: >
        Basing in Roma Norte keeps most of the itinerary on foot. The Polanco
        alternative would have cost $56 to $88 each in rideshare.

  per_person: 1516

  # Borne by two people, not seven, so it sits outside the per person total
  # above. Quoting the other five for a balloon they are not getting on would
  # overstate the trip for them by more than the lucha libre night costs.
  balloon_travelers: 2
  not_shared:
    - item: Hot air balloon over Teotihuacan, 2 January
      travelers: 2
      per_person: 171
      unit_price: 341
      unit_label: both passengers, shared basket
      status: quoted
      verified: 2026-10-23
      note: >
        Krysta and Ryan only. Priced 23 October by selecting 2 January at two
        guests on the operator's own listing. $341 for the pair on the
        highest rated of the four, 4.97 from 8,319 ratings. The field runs
        $332 to $385 for two and all four refund in full to one day before.
        Replaces a $211 each estimate across seven that assumed a Volare
        private basket, a group that is no longer going and a 2027 rate that
        was never confirmed.
        Two things could still move this. A private flight is the likelier
        yes given the weight limits and should be budgeted at roughly double
        until a real quote comes back. And the balloonport surcharges
        passengers over 100 kg, which adds about $117 across the pair at the
        $2 per kilo rate the listings quote, though published rates conflict
        enough that this is not settled. Both are open in docs/balloon.md.

riviera:
  travelers: 6
  recommended_build: flexible room-only rate, eat in the village, one big excursion
  lines:
    - item: Two Bedroom Oceanview Residence, flexible room-only
      per_person: 887
      unit_price: 5323
      unit_label: whole residence, 5 nights, split 6 ways
      status: quoted
      verified: 2026-10-02
      note: >
        Taxes included. Non-refundable is $754 each, but refunds nothing from
        the moment it is booked.

    - item: Food in town, 5 days
      per_person: 324
      status: estimate
      note: About $65 per day including tip.

    - item: CUN airport transfer, round trip
      per_person: 21
      status: estimate
      note: The transfer is $100 to $125 for the van at any headcount, so this falls if more people come.

  per_person: 1232

  alternative_all_inclusive:
    per_person: 1449
    lodging_and_board_per_person: 1309
    delta_per_person: 98
    note: >
      All-inclusive works out to $84.30 per adult per night at the current
      discount, so full board costs only $98 more each than room-only plus
      eating in the village. That gap used to be $239 each. Break-even is
      about two resort cocktails a day. Room-only is still the pick given the
      16 minute village walk, but it is now close enough to put to the group.

  optional:
    - item: Chichen Itza private tour
      per_person: 119
      status: estimate
      note: >
        Was a committed line with 5 January reserved for it. Moved here on
        23 October: the beach leg is four unplanned days and no excursion is
        being booked yet. Still the biggest single thing available to add back.
    - item: Isla Mujeres ferry
      per_person: 34
      status: estimate
      note: MX$580 each, round trip.
    - item: Tulum beach club day
      per_person: null
      status: open
      note: Unpriced. Table minimums for 6 in early January have never been quoted. 87 minutes each way.
    - item: Rental van for the week
      per_person: 56
      status: estimate
      note: Net, after skipping the airport transfer. Only worth it with two or more excursions.

per_person:
  full_trip: 4671      # 1923 flights + 1516 city + 1232 beach
  city_only: 4655      # 3139 flights + 1516 city
  note: >
    The balloon is not in either figure, because two people are going rather
    than seven. Krysta and Ryan add about $171 each on top of the full trip
    number, more if the flight goes private. Nobody else pays it.

excludes:
  - personal spending
  - travel insurance
  - tips beyond the quoted dinners
  - anything bought on the ground

split_mechanism:
  - Agree a per-person target before booking
  - Lodging is the only line billed as a whole. Both are split evenly by head.
  - Keep the two legs on separate ledgers. Guests who leave after Mexico City should not carry beach costs.
  - Anyone joining only for the beach should not carry New Year's Eve.
  - Under room-only at the beach, food is individual rather than prepaid. Agree up front whether meals go on one card and get split, or people pay their own.
  - Note who fronts which booking and how they are repaid
  - Splitwise or similar, agreed up front

non_refundable_exposure:
  - what: Casa KM Airbnb, booked 18 October
    terms: >
      Committed. $1,585.51 already paid, $2,251.42 due 14 December, and only a
      partial refund until 16:00 on 22 December. Nothing after that.
  - what: Lucha libre with El Taco Club, booked 23 October
    terms: >
      Paid $715.53 in full on booking. Fully refundable until 28 December,
      nothing after that.
  - what: The Fives, flexible rate
    terms: Free cancellation, refundable until 13 December 2026
  - what: Pujol, booked 23 October for 2 January
    terms: >
      Nothing paid, the card is only a guarantee. Free to change or cancel
      online until 14:30 on 1 January 2027. Inside that 24 hours, MX$2,000 per
      person applies to a cancellation, a no-show, a date change or a cut to
      the diner count, which is about $824 across seven. The window is 24
      hours and not the 48 this file previously claimed.
  - what: New Year's Eve galas
    terms: Typically prepaid
  - what: Balloon
    terms: >
      Nothing booked. All four operators refund in full up to one day before,
      so there is no exposure until one is chosen. Book nothing before the
      weight question is answered in writing.

flag_for_solo_b: >
  The one traveller leaving after Mexico City pays $4,655, only $16 less than
  the $4,671 paid by the six doing the whole eleven days, because the MEX to
  DTW Delta nonstop is $1,893 one way. Connections that day run $774 to $956.
  Taking one saves about $1,040 and brings them to roughly $3,615. This used
  to apply to two people; the drop on 12 October left one.
