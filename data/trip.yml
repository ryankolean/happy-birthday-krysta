# Used for every USD conversion in this repo.
exchange_rate:
  mxn_per_usd: 17.0
  range: 16.97 to 17.18
  as_of: 2026-09

# Mexico City runs UTC-6 year round and does not observe DST.
timezones:
  cdmx: America/Mexico_City
  cancun: America/Cancun
  home: America/Detroit

taxes:
  cdmx_lodging: 19.5%   # 16% IVA + 3.5% CDMX lodging tax
  quintana_roo: 21%     # 16% IVA + 5% Quintana Roo ISH

# Per person only. Group totals are deliberately not tracked anywhere in this
# repo: people pay for themselves, and a whole-trip number nobody writes a
# cheque for only made the figures harder to read.
per_person_usd:
  full_trip: 4876
  city_only: 4741
  excludes:
    - personal spending
    - travel insurance
    - anything bought on the ground

verified: 2026-10-02
