  - id: jade-payment-terms
    title: Ask Dreams Jade whether 3 January counts as a New Year reservation
    status: done
    date: 2026-11-03
    outcome: >
      Answered in writing on 3 November, and every answer went our way.
      Payment: the Christmas and New Year full-prepayment exception does not
      apply to a 3 January arrival. One night per room at booking, $1,684
      across the four, balance at check-in. Ryan fronts $1,684, not $8,420,
      and nobody has to be collected from before the trip.
      Cancellation: free until 30 December 2026, stated as a date. That is a
      day earlier than the 31 December this repo had pencilled from counting
      back, so the task date moved with it.
      Promotions: no confirmed Black Friday or Cyber Monday information, and
      the resort does not expect these dates to move much. No reason to wait.
      Price drops: not honoured on a confirmed reservation. The only route to
      a lower rate is cancel and rebook, which is free until 30 December.
      The build requests, four Kings and the adjacency note and the birthday
      amenity, were all taken and added to the reservations subject to
      availability. Concierge contact for the amenity is in
      private/jade-quote.md.

  - id: decide-jade-split
    title: Decide whether the Jade rooms split evenly or per room
    status: done
    date: 2026-11-10
    outcome: >
      Even split, decided 2 November 2026. All six pay $1,403. The four
      coupled travellers absorb $933 between them rather than billing
      Christian and Bubba extra for private rooms that were decided for them.
    why: >
      New question, created by the quote itemising two rates. It never came up
      while the beach leg was one undifferentiated number.
      Split evenly by head, which is what this repo has always done, every one
      of the six pays $1,403. Charge each room what it costs and the four
      people in couples pay $1,170 while each single pays $1,870.
      That is $233 a head either way: the even split has the couples putting
      in $933 between them so the two singles do not carry the full cost of a
      private room. Neither answer is wrong and both are easy to defend, but
      it has to be settled before anybody is asked for a deposit, because it
      changes the number four people are asked for.
      Ask the two singles. They are the ones it costs, and giving them their
      own rooms was a decision made on their behalf.
      Full working in data/budget.yml under riviera.split_question.

