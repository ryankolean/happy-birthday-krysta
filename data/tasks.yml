  - id: pick-jade-build
    title: Pick the room build at Dreams Jade
    status: done
    detail: >
      DECIDED 2 November 2026: four rooms, all Junior Suite Ocean View, King
      bed in every one, two couples and two singles, all four in the same
      category and requested adjacent. $8,420 direct, nothing booked yet.
      See book-jade for what is left.
      The argument that got there, kept because it is why the number is what
      it is. The resort quoted four Ocean View Junior Suites
      direct on 2 November at $8,420, which is $1,403 each split six ways and
      $635 under the Booking flexible rate the ladder on the accommodations
      page is built from.
      The adjacency answer settled the build. All four rooms must be in the
      same category for the front desk to even attempt to place the group
      together, so every mixed-category row on that ladder now also buys a
      group scattered across the property. That was the thing the ocean view
      build was being bought to avoid, so the cheaper mixed options are no
      longer the trade they looked like.
      What is left is the fourth room, which was always the real question.
      Three rooms at $1,115 each puts the two singles together in a room with
      two full beds, breaks no rule, and is now $288 each cheaper rather than
      $394. Ask the two singles before assuming.
      Two things to clear first: decide-jade-split and jade-payment-terms.
      Neither changes the build, both change what people are asked to pay and
      when.

