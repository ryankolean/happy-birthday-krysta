decisions_needed:
  - id: confirm-dinner-headcount
    title: Lock the birthday lunch headcount before 1 January
    status: todo
    detail: >
      The table is booked for 7 and a headcount message went out to the group
      on 23 October. Changing the number is free online through OpenTable
      right up to 14:30 on 1 January, and costs MX$2,000 per head after that,
      so there is no hurry but there is a hard edge.
      One real limit: Pujol has no online availability at all on 2 January for
      9 or more. Six, seven and eight all return the same seatings, so the
      party can move freely inside that range, but a ninth yes cannot be
      absorbed online and would mean emailing the restaurant directly.

  - id: pick-jade-build
    title: Pick the room build at Dreams Jade, then book it
    status: todo
    detail: >
      The only thing holding up the beach booking. Eight builds work and the
      full ladder with every price is on the accommodations page.
      Recommended: four rooms, everybody in a Junior Suite with Ocean View,
      $1,509 each on the flexible rate. Everyone has their own room, everyone
      has the same room, and all four sit in the same buildings.
      The real question is not the view, it is the fourth room. Three rooms
      at $1,115 each puts the two singles together in a room with two full
      beds, which breaks no rule, and saves $394 each. Giving each single
      their own room costs $534 more each. Upgrading a couple to Ocean Front
      costs $244. Ask the two singles what they want before assuming.
      If the group will not carry the ocean view build, the fallback is four
      rooms with Krysta and Ryan in an Ocean Front King at $1,420 each, where
      the birthday couple absorb the upgrade and nobody else pays more.

  - id: book-via-prive
    title: Decide whether to book Dreams Jade through a Hyatt Prive advisor
    status: todo
    detail: >
      Prive is Hyatt's advisor-only program. Dreams is in it, five nights
      clears its four-night minimum, and it reportedly adds a property credit
      of roughly $100 per stay, a room upgrade confirmed at booking and a
      welcome amenity, at the same rate as Hyatt's public flexible price.
      Four reservations may mean four credits.
      Every source for this is an agency or affiliate blog rather than Hyatt,
      so get the credit and the upgrade in writing before paying. Worth one
      conversation before booking direct.

  - id: solo-b-routing
    title: Decide the 3 January flight home from Mexico City
    status: todo
    detail: >
      Now one traveller rather than two. They should look at a connection and
      save about $1,040 against the $1,893 Delta nonstop.

