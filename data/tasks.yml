decisions_needed:
  - id: confirm-dinner-headcount
    title: Lock the birthday lunch headcount before 1 January
    status: todo
    detail: >
      The table is booked for 7 and a headcount message went out to the group
      on 23 October. Changing the number is free online through OpenTable
      right up to 14:30 on 1 January, and costs MX$2,000 per head after that,
      so there is no hurry but there is a hard edge.
      One real limit: Pujol has no online availability at all on 2 January for
      9 or more. Six, seven and eight all return the same seatings, so the
      party can move freely inside that range, but a ninth yes cannot be
      absorbed online and would mean emailing the restaurant directly.

  - id: pick-fives-layout
    title: Pick the room layout at The Fives, then book it
    status: todo
    detail: >
      The only thing holding up the beach booking. One Two Bedroom Oceanview
      Residence is $792 each on the flexible rate but has three beds for six
      adults, so the two singles end up sharing. Adding a Junior Suite for the
      singles makes it $1,143 each and nobody shares a bed. A One Bedroom
      instead of the Junior Suite is $1,280 each and still puts one single on
      a sofa bed.
      Recommendation is the residence plus the Junior Suite. Decide, then book
      on the flexible rate, which refunds in full until 13 December.
      There is now a reason to do this sooner rather than at leisure. The
      32 percent discount the prices above rest on is promotional. A
      shallower tier of about 18 percent has been seen on the same search,
      and reverting to it would cost roughly $199 per person on the
      recommended layout. Booking flexible locks the rate and still refunds
      in full, so the decision costs nothing to make early and about $199
      each to make late.

  - id: pick-meal-plan
    title: Room-only or all-inclusive at The Fives
    status: todo
    detail: >
      All inclusive adds $513 each against a $324 food estimate for the
      village, so room only is about $189 cheaper. It used to be a $98 gap and
      a close call. It is not close any more. The room can be booked before
      this is settled.

  - id: solo-b-routing
    title: Decide the 3 January flight home from Mexico City
    status: todo
    detail: >
      Now one traveller rather than two. They should look at a connection and
      save about $1,040 against the $1,893 Delta nonstop.

