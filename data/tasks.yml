  - id: jade-cancellation-cliff
    title: Last day to cancel Dreams Jade without a penalty
    status: todo
    date: 2026-12-30
    why: >
      Confirmed in writing by the resort on 3 November: cancellations are
      free up to 30 December 2026. This said 31 December until then, which
      was counted back three days from a 3 January arrival rather than taken
      from the resort. They count a day tighter. Do not work to the old date.
      After it, a cancellation or a no-show costs one night, which is $1,684
      across the four rooms. That is the entire downside, which makes this a
      far softer cliff than Casa KM's on 22 December.
      It is also the last day a better rate can be taken. The resort will not
      reprice a confirmed booking, so a drop found before 30 December is
      captured by cancelling and rebooking at no cost, and one found after is
      not worth the $1,684.

