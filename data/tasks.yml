decisions_needed:
  - id: confirm-dinner-headcount
    title: Lock the birthday lunch headcount before 1 January
    status: todo
    detail: >
      The table is booked for 7 and a headcount message went out to the group
      on 23 October. Changing the number is free online through OpenTable
      right up to 14:30 on 1 January, and costs MX$2,000 per head after that,
      so there is no hurry but there is a hard edge.
      One real limit: Pujol has no online availability at all on 2 January for
      9 or more. Six, seven and eight all return the same seatings, so the
      party can move freely inside that range, but a ninth yes cannot be
      absorbed online and would mean emailing the restaurant directly.

  - id: confirm-balloon
    title: Settle the balloon weight question in writing before booking
    status: todo
    detail: >
      Rewritten 23 October. The old version asked whether Volare flies that
      date and whether they would hold a private basket for 7. Both questions
      are dead. Four operators on Airbnb show 2 January availability, so the
      date is answered, and the balloon is now two passengers rather than the
      whole group.
      What replaces it is a harder question. Both passengers are over the
      100 kg threshold the balloonport charges against and one is above the
      120 to 125 kg ceiling that several operators publish as an absolute
      maximum, so this is a refusal risk at the launch site after an 04:00
      pickup, not just a surcharge. Message the host with the real declared
      weights from private/balloon-weights.md and get three answers in the
      Airbnb thread: is the heavier passenger accepted, what is the exact
      rate and currency, and is it collected in advance or on the day.
      Ask a second operator too, so there is a fallback that has already
      answered. Book nothing until it is in writing.
      Full research, pricing for two and the source list are in docs/balloon.md.

