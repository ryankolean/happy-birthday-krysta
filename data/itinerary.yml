# All eleven days. The website renders this.
# Of the five nights in Mexico City, three are committed and one is a write-off.
# That is the whole shape of the week and it is why the dinner list had to be cut.

days:
  - date: 2026-12-29
    weekday: Tuesday
    leg: cdmx
    kind: travel
    title: Arrive, then lucha libre
    summary: Fly to Mexico City, tacos and the arena at a quarter to six, nothing after
    events:
      - time: "08:40"
        what: DL 646 departs Detroit, lands Mexico City 12:30
      - time: "14:30"
        what: At the house in Del Valle Norte
        detail: >
          Immigration plus transfer runs about 90 minutes. That leaves about
          three and a quarter hours before the evening starts.
      - time: "17:45"
        what: Lucha libre with El Taco Club, booked
        detail: >
          Tacos, beer and mezcal first, then the group walks to the arena
          together. Attraction tickets, a full meal, specialty drinks and a
          mask are all included, so this is dinner as well as the show.
          Runs to 20:45. Minimum age 15.
        why: >
          Booked 23 October for all 7 at $715.53 all in, which is $102.22
          each. The experience includes a full meal, so it is dinner as well
          as the show and nothing else needs booking for the night.
      - time: after
        what: A bite nearby only if anyone is still hungry, then back to the house
        detail: >
          Nothing else is booked and nothing else is going to fit. The
          experience already includes a full meal, so this is a top up rather
          than a plan: pick somewhere near wherever the show lets out, eat,
          and go. No bar on the list tonight.
    warnings:
      - The exact meeting point arrives by direct message on the day, not in advance
      - A flight delay much past 16:30 puts the booking at risk. Cancel by 28 December for a full refund
      - No large cameras, the arena does not allow them. Bring pesos for souvenirs
      - >
        Both arenas sit in parts of town that are not worth lingering in late.
        Eat close by if you want to, then take a car back rather than walking on
        to somewhere else.

  - date: 2026-12-30
    weekday: Wednesday
    leg: cdmx
    kind: city
    title: Taco day
    summary: Street food on foot, all day, no reservations
    events:
      - time: all day
        what: Street food crawl through Roma Norte and Condesa, working outward
        detail: >
          Replaces the guided Sabores food tour that was penciled in. Saves about
          $115 each and is closer to what Krysta actually asked for.
      - time: evening
        what: Keep it casual, or Cuina on Tabasco 46, a four minute walk
        detail: No tasting menu on a day spent eating tacos.
      - time: late
        what: Drinks at Owl Bar, the Condesa speakeasy
        detail: Opens Wednesdays, 18:00 to 02:00.

  - date: 2026-12-31
    weekday: Thursday
    leg: cdmx
    kind: anchor
    title: New Year's Eve
    summary: Dinner at the house, midnight on the rooftop
    events:
      - time: morning
        what: Mercado Medellin run, Campeche 101 in Roma Sur, about a 25 minute walk
        detail: Open 08:00 to 19:00. The fondas at the back run hardest noon to 15:00.
      - time: "13:00"
        what: Collect pre-ordered dishes
        detail: >
          Every New Year's Eve pickup window in the city is 13:00 to 17:00.
          This is an afternoon errand, not an evening one.
      - time: evening
        what: Potluck dinner at the house, on our own schedule
      - time: "00:00"
        what: Midnight on the Casa KM rooftop
        detail: This is why the house was chosen over hotel rooms.
    plan_status: >
      Approach decided, specific orders not placed. See docs/nye.md for the
      three options and what each costs.
    warnings:
      - Reforma closes both directions, plus Florencia, Rio Tiber and Rio Rhin
      - The free Reforma party runs 18:00 to 02:00 and draws about 250,000 people
      - The Zocalo is dark, the city confirmed no programming
      - Cars will not move. Keep everything walkable from the front door.
      - Of the restaurants open on a normal menu, only Macelleria is in Roma Norte and it closes at 19:00

  - date: 2027-01-01
    weekday: Friday
    leg: cdmx
    kind: rest
    title: Recovery, deliberately empty
    summary: Nothing booked, on purpose
    events:
      - time: midday
        what: Late brunch at the house, or Lardo in Condesa
      - time: evening
        what: An early night
        detail: Gin Gin Cibeles and Owl Bar are the only sure things if anyone wants out.
    warnings:
      - Anthropology Museum closed
      - Casa Azul explicitly closed 1 January
      - Most of the city is shut and the group will have been out late
      - Small taquerias commonly close 31 December and 1 January without publishing it

  - date: 2027-01-02
    weekday: Saturday
    leg: cdmx
    kind: birthday
    title: The birthday
    summary: A free morning, then Pujol at half past two, booked
    events:
      - time: morning
        what: Free, nothing booked
        detail: >
          Deliberately open. A 14:30 lunch in Polanco means leaving the house
          around 13:45, so the morning is genuinely free rather than a
          countdown. Bazar Sabado runs Saturdays only and fits here.
      - time: "14:30"
        what: Birthday lunch at Pujol, booked
        detail: >
          Table for 7 in the main dining room, six course menu, about two and
          a half hours. Tennyson 133 in Polanco, roughly 4.7 km from the house.
          No shorts or sportswear, 15 minute grace period, no valet parking.
          Give any dietary restrictions in advance.
        why: >
          Booked 23 October at $223 each. The eight tasting menu minimum that
          broke this at seven applies to the private room, not to a regular
          table, so booking a normal table sidestepped it entirely.
      - time: "17:00"
        what: Out of Pujol, nothing booked after
        detail: >
          Either stay in Polanco for an hour, where Masaryk, Parque Lincoln
          and the Soumaya and Jumex museums are all close, or head back
          toward Roma. Options are on the birthday page.
      - time: evening
        what: Drinks, if anybody wants them
        detail: >
          Rayo caps at 8, which fits seven exactly, and runs to 01:15 on
          Saturdays. Limantour, Handshake and Gin Gin Cibeles are the other
          three, all pinned on the map. Nothing is booked.
      - time: late
        what: No dinner
        detail: >
          A two and a half hour lunch finishing at 17:00 is the big meal of
          the day. Anyone still hungry later eats near the house.
    warnings:
      - Free to change or cancel until 14:30 on 1 January. After that it is MX$2,000 per person
      - A headcount change inside that same 24 hours is charged exactly like a cancellation
      - Pujol has no online availability at all for 9 or more on this date
      - Pujol is switching from a tasting menu to a five course restaurant menu, mainly fish and shellfish. Give dietary restrictions in advance

  - date: 2027-01-03
    weekday: Sunday
    leg: travel
    kind: travel
    title: Travel day to Cancun
    summary: Six to Cancun, one home, both flights at 13:55
    events:
      - time: "11:00"
        what: Checkout at Casa KM. Leave together around 11:30.
      - time: "13:55"
        what: Both flights depart at the same time
        detail: >
          Six to Cancun on Aeromexico, one to Detroit on Delta. Nobody waits
          around at the airport. Neither is booked yet.
      - time: "17:33"
        what: Land in Cancun
        detail: Transfer to Puerto Morelos is 27 km and about 27 minutes.
      - time: evening
        what: Settle in at The Fives
        detail: Nothing planned. The residence is not booked yet either.
    warnings:
      - Neither flight is booked, and The Fives is still only verified available
      - The one flying home could save about $1,040 by taking a connection instead of the nonstop

  - date: 2027-01-04
    weekday: Monday
    leg: riviera
    kind: beach
    title: Beach
    summary: Nothing. That is the point of this leg.
    events:
      - time: all day
        what: Nothing scheduled
        detail: The village is a 16 minute walk with 19 restaurants inside a kilometre.

  - date: 2027-01-05
    weekday: Tuesday
    leg: riviera
    kind: beach
    title: Beach
    summary: Nothing scheduled
    events:
      - time: all day
        what: Nothing scheduled
        detail: >
          The village is a 16 minute walk if anybody wants to leave the sand.
          Nothing is being planned for this day on purpose.

  - date: 2027-01-06
    weekday: Wednesday
    leg: riviera
    kind: beach
    title: Beach
    summary: Nothing scheduled
    events:
      - time: all day
        what: Nothing scheduled
        detail: >
          Same as yesterday. The point of this leg is to be on the beach
          rather than on a road or a ferry.

  - date: 2027-01-07
    weekday: Thursday
    leg: riviera
    kind: beach
    title: Beach
    summary: Last full day, dinner in the village

  - date: 2027-01-08
    weekday: Friday
    leg: travel
    kind: travel
    title: Home
    summary: DL 1911 at 15:15
    events:
      - time: "12:00"
        what: Checkout. Leave for the airport around 11:45.
      - time: "15:15"
        what: DL 1911 to Detroit, lands 19:10
        detail: Cancun in the first week of January genuinely needs three hours.

does_not_fit:
  - item: Quintonil
    why: Caps at 6 in the main dining room, 1 to 3 at the counter. Cannot seat 8.
  - item: La Table Krug
    why: >
      One seating at 20:00, Tuesday to Saturday. 29 December went to lucha
      libre and 30 December is taco day, so there is no night left for it.
      It is at the St. Regis besides, so it was already ruled out if the
      group takes a St. Regis New Year's Eve.
  - item: Bikes and Munchies street food bike tour
    why: No day left for a second food tour.
  - item: Casa Azul
    why: Wants a half day. 30 Dec is taco day, 31 is New Year's Eve, 1 Jan it is closed, 2 Jan is the birthday.
  - item: Teotihuacan as its own day trip
    why: >
      Nothing covers Teotihuacan and there is no spare day in the city to give
      it: 29 December is lucha libre, 30 is taco day, 31 is New Year's Eve,
      1 January is the rest day and 2 January is the birthday. It wants a full
      day and there is not one.
