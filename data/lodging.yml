# Two properties, and only two. Casa KM in Mexico City is booked and partly
# paid. The Fives in Puerto Morelos is priced live and not booked.
# Everything that was ever a runner up has been cut from this file.

properties:
  - id: fives
    leg: riviera
    name: The Fives Oceanfront Puerto Morelos
    room_type: Two Bedroom Oceanview Residence
    platform: direct, Paraty Tech engine
    url: https://www.thefiveshotels.com/the-fives-oceanfront-puerto-morelos.html
    status: available
    repriced: 2026-10-27
    checkin: 2027-01-03
    checkout: 2027-01-08
    nights: 5
    adults: 6
    group_shape: 2 couples and 2 singles
    checkin_time: "15:00"
    checkout_time: "12:00"
    size_sqft: 1421
    max_occupancy: 8
    taxes_included: true
    discount_live: 32%
    discount_flexible: 20%
    inventory_seen: 10 units

    # The whole point of this block. Six adults as two couples and two singles
    # does not fit one residence without somebody sharing a bed.
    layout_problem: >
      The Two Bedroom Oceanview Residence sleeps up to eight, but it has three
      beds: a king in bedroom one and two queens in bedroom two. Two couples
      and two singles is six adults across those three beds, so one couple
      takes the king, one couple takes a queen, and the two singles are left
      sharing the remaining queen. The engine accepts it. Nobody would enjoy it.
    layout_recommended: >
      Take the Two Bedroom Oceanview Residence for the two couples and add a
      Junior Suite for the two singles. The Junior Suite has a king and a
      double sofa bed, so each single gets their own bed and the couples each
      get a private bedroom with a private bathroom. It is the cheapest
      combination on the property in which nobody shares a bed.

    # Live on the resort's own engine 27 October 2026, 3 to 8 January 2027,
    # accommodation only, taxes included. Non-refundable is 32 percent off the
    # rack rate, flexible is 20 percent off. The unit price does not move with
    # headcount. Flexible figures marked derived were calculated by applying
    # the engine's own 20 percent to the rack rate, because the engine only
    # prints a flexible price after a room is selected.
