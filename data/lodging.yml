    # Every arrangement in which all six adults get a bed of their own and
    # nobody sleeps on a sofa. All figures are all-in, VAT added, split 6 ways.
    # Four separate reservations are four independent prices: one couple
    # buying up does not move anybody else's rate.
    combinations:
      - id: three_base
        label: Three rooms, all standard Junior Suite
        units: 3
        rooms_detail: 2 couples in a Junior Suite King, both singles sharing a Junior Suite Two Double
        sleeps: >
          The singles share a room but not a bed. Two full beds, one each.
        nonrefundable_usd: 5684
        nonrefundable_per_person_usd: 947
        flexible_usd: 6689
        flexible_per_person_usd: 1115
      - id: three_a_ocean_front
        label: Three rooms, one couple Ocean Front
        units: 3
        rooms_detail: Krysta and Ryan in an Ocean Front King, the other couple in a Junior Suite King, both singles sharing a Junior Suite Two Double
        sleeps: >
          Same as above, with one couple moved to the water's edge. They carry
          the whole upgrade themselves at $1,181 each.
        nonrefundable_usd: 6171
        nonrefundable_per_person_usd: 1029
        flexible_usd: 7259
        flexible_per_person_usd: 1210
