    # The whole point of this block. Six adults as two couples and two singles
    # does not fit one residence without somebody sleeping in the living room.
    layout_problem: >
      The Two Bedroom Oceanview Residence has four sleeping surfaces, not
      three. Bedroom one is a king. Bedroom two holds two queen beds and has
      its own bathroom and its own balcony. The living room then adds a double
      sofa bed, because the unit is described as a One Bedroom Partial
      Oceanview Residence with a second bedroom bolted on, and that one
      bedroom layout carries a sofa bed.
      So one unit sleeps six adults, which is its published maximum, but only
      by putting two of them in the living room. Two couples and two singles
      means a couple on the sofa bed, or a single on it, whichever way it is
      cut. That is the problem, and it is one bed short rather than three.
    layout_recommended: >
      Give the second bedroom to the two singles. It has two queen beds, a
      private bathroom and its own balcony, so each of them gets a real bed
      and they share a room that is effectively a self contained wing. Put one
      couple in the king, and buy one small unit for the other couple. A
      Junior Suite is the cheapest way to do that and nobody touches the sofa
      bed.
      This is the correction that matters: the earlier version of this plan
      put the singles in the Junior Suite, where one of them would have taken
      its sofa bed. Same two units, same money, materially worse. The second
      bedroom of the residence is the best room on the property for two people
      travelling alone, and it was being given to a couple who did not need it.

