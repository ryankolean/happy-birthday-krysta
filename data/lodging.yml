        bed: King
    checkout_time: "11:00"
    rating: 4.91
    reviews: 145
    host: Roma Spot, Superhost, 7 years hosting
    cancellation:
      headline_badge: Free cancellation
      actual: Free for 24 hours after booking, then partial refund only until 22 December 2026
      warning: >
        The badge is misleading. After 22 December there is no refund.
        Treat the deposit as committed once placed. Collect deposits first.
    why_chosen:
      - Six private bedrooms for 3 couples plus 2 singles, with one spare
      - Private rooftop for midnight on New Year's Eve
      - No quiet hours in the house rules
      - Full kitchen, which the New Year's Eve plan uses
      - 6.5 bathrooms for 8 people
    displaced_on: 2026-10-12
    displaced_by: Casa KM
    displaced_because:
      - >
        Guests report no windows in most bedrooms. One: "no windows in most of
        the rooms, which means very little airflow unless you leave your room
        door open." Another: "no A/C so the upstairs rooms get hot. no windows
        so there is no airflow but there were tower fans in all rooms."
      - >
        Two separate reviews raise the smell. "The house smells very musty, and
        so do the towels and bedding. You can't rest because of the smell." A
        second lists "visible mold on ceiling of some bedrooms" and "occasional
        sewage smell by lower common area."
      - >
        A guest notes "there is no real kitchen appliances to use", which the
        New Year's Eve plan depends on.
      - >
        The street-facing first bedroom has road noise and a street lamp with no
        curtains. One guest bought and installed curtains during their stay.
      - At 7 guests it reprices to $3,996, or $571 each, the most expensive option on the board.
    flags:
      - Airbnb marks these dates "Rare find, this place is usually booked"
      - Total moves with guest count, so re-price if the party changes from 8
      - There is no waitlist on Airbnb

