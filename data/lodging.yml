        recommended: true

    recommendation_note: >
      Four rooms, everybody Ocean View, is the most expensive thing on this
      list and it is still the one to take. It is $89 each above buying one
      couple an Ocean Front, and for that it removes both of the awkward
      conversations: nobody is in a better room than anybody else, and the
      whole group is in the same buildings rather than scattered by category.
      The cheaper answers are real and nothing is wrong with them. Three rooms
      at $1,115 each breaks no rule, because two full beds in one room is not
      bed sharing. The question is whether the group would rather spend $394
      each on private rooms and a view or keep the money.

    preferred_club:
      what: >
        Private lounge with breakfast, afternoon hors d'oeuvres and premium
        liquor, an exclusive adults-only pool, concierge check-in, upgraded
        bath amenities and a pillow menu.
      pricing_quirk: >
        Preferred Club Junior Suite Tropical View at $2,103 all-in is cheaper
        than a plain Ocean View King at $2,140. Club access costs less than a
        view at this property. It carries no single-occupancy discount, so it
        suits a couple and never a single.
      verified: Travel-trade listings, not the resort's own site. Confirm inclusions before paying.

    rate_choice:
      recommended: flexible
      premium_per_person_usd: 225
      note: >
        On the recommended build the flexible rate costs $225 each more than
        the non-refundable one, $1,509 against $1,284. The build is not
        settled, nothing is booked, and the trip is fourteen months out, so
        flexible is the call until the group picks a layout. Switch to
        non-refundable only once the build is agreed and the money is ready.

    hyatt_prive:
      what: >
        Hyatt's advisor-only booking program. Dreams is in it and the five
        nights clear its four-night minimum. Reported benefits are a property
        credit of roughly $100 per stay, a room upgrade confirmed at booking,
        a welcome amenity, and early check-in and late checkout on
        availability. Four reservations may mean four credits.
      cost: Nothing. The rate normally matches Hyatt's public flexible rate.
      caution: >
        Every source for this is a travel agency or affiliate blog rather than
        Hyatt itself. Get the credit and the upgrade in writing before paying.
        The Prive rate tracks the flexible rate, so it is not comparable to
        the non-refundable figures on this page.
      verified: 2026-10-28

    group_booking: >
      Four rooms is not a group. Hyatt Inclusive Collection group desks start
      at ten rooms, so there is no group rate to ask for and no group discount
      being withheld. Anyone who offers one is selling something else.

    flexible_terms: Free cancellation, exact deadline to be confirmed at booking
    contact:
      hyatt_inclusive_us: "+1 800 597 4761"
      resort_direct: "+52 998 872 8888"
      direct_unverified: >
        The resort direct number comes from travel trade directories. Hyatt's
        own site blocks automated checks, so it has not been confirmed against
        a Hyatt page. Use the Hyatt Inclusive Collection line first.

    why_jan_3: >
      Unchanged from the previous property. The beach leg starts on 3 January
      because the Mexico City leg runs to that morning, and because holiday
      rate bands across the Riviera Maya end on 2 January.

    ask_on_the_call:
      - Can four reservations be linked and assigned adjacent or in the same building, including across room categories
      - Confirm the single-occupancy rate and the bed type on both solo rooms, in writing on the confirmation
      - A birthday amenity for Krysta's 35th
      - Whether they will match the $1,617 non-refundable Booking rate on a direct booking
      - What the Quintana Roo state tourist tax comes to and whether it is collected at the resort

    open:
      - Which of the eight builds the group wants, which is the only thing holding up the booking
      - Whether to book through a Hyatt Prive advisor for the property credit and upgrade
      - Whether Hyatt direct beats the Booking.com rate, which could not be checked because hyatt.com blocks automated access
      - The Quintana Roo state tourist tax, charged per visitor and separate from the hotel bill
      - Whether the resort runs its own airport transfer and what it costs for six
      - Whether the two singles want their own rooms at all, which is the $534 each question

