  room_plan: >
    The two couples take the king and one of the two-queen rooms. The two
    singles take the other two-queen room and bedroom 4. Two rooms hold two
    queens each, so whoever is in them leaves a bed unused.
  roof: No roof and no terrace. The flat faces a park across the street.
  distance_km:
    roma_norte_core: 1.0
    parque_mexico: 0.4
    em: 0.3
    pujol: 3.5
  cancellation:
    actual: Free for 24 hours after booking, then partial refund only until 22 December 2026
  why_consider:
    - 4.85 from 193 reviews, the longest track record of anything checked on these dates
    - Location scores a straight 5.0, and it faces a park 400m from Parque Mexico
    - A three minute walk to Em, the closest any option gets to a birthday dinner venue
    - Lift in the building, washer and dryer in the unit, gas stove and oven
    - Smoke alarm and carbon monoxide alarm both present
    - Reviews confirm it has handled a group of 11 without trouble
  flags:
    - >
      Bedroom 4 has a separate entrance. The host writes that three bedrooms sit
      together "while the fourth one has a separate entrance, accessed through a
      different door." A guest confirms whoever sleeps there "has to knock on the
      apartment entrance" to rejoin everyone. One of the two singles would get it.
    - Three bathrooms for seven people, against four and a half at Casa KM
    - No roof and no terrace, so there is no midnight spot in the building
    - Cancellation is free for 24 hours only, the same cliff as Casa KM
    - No air conditioning, portable fans only
    - >
      Staff water the house plants every Wednesday and Saturday between 11:00
      and 15:00. That lands on 30 December and 2 January.
    - Capacity is 14, so we would be paying for a flat built for twice our number
  verdict: >
    The safest bet on reviews and the best placed for dinner, but at the six way
    split it now costs $269 more each than Casa KM for fewer bathrooms, no roof,
    and a bedroom one of the singles reaches through a different door. It is the
    most expensive option on the board.

