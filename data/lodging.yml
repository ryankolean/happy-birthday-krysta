    # Listed only so nobody re-proposes it. It is the cheapest thing available
    # and it is the arrangement this whole block exists to avoid.
    rejected_single_unit:
      label: One Two Bedroom Oceanview Residence on its own
      nonrefundable_usd: 3835
      nonrefundable_per_person_usd: 639
      flexible_usd: 4512
      flexible_per_person_usd: 752
      why_rejected: >
        It physically sleeps six, but only by putting two adults on the living
        room sofa bed. Whoever takes it has no door and no privacy for five
        nights, and the living room stops being shared space the moment it
        becomes somebody's bedroom.

    price_moved_in_our_favour: >
      These dates keep getting cheaper. The Two Bedroom Oceanview Residence
      was $4,525 non-refundable and $5,323 flexible on 2 October. It was
      $4,037 and $4,749 earlier on 27 October. It is $3,835 and $4,512 now.
      The flexible rate has fallen $811 since the budget was first built,
      which is more than the entire cost of the Junior Suite that fixes the
      sleeping arrangement. Fixing it now costs less than doing nothing did
      three weeks ago.

    three_bedroom_not_available: >
      The property publishes a Three Bedroom Oceanfront Residence that would
      solve this in one unit. It does not appear in the engine for these dates
      at any headcount, searched at 6, 7 and 8 adults on 27 October. This
      matches what was found on 2 October, when the Oceanfront's three bedroom
      was already sold out for these dates and the sister property still had
      inventory, so it is most likely genuinely gone rather than withheld from
      online sale. Worth one email before settling for two units.

