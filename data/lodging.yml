# Two properties, and only two. Casa KM in Mexico City is booked and partly
# paid. Dreams Jade in Puerto Morelos is priced live and not booked.
# Everything that was ever a runner up has been cut from this file.

properties:
  - id: jade
    leg: riviera
    name: Dreams Jade Resort & Spa
    room_type: Junior Suite with Ocean View King Bed
    platform: direct with the resort, priced against Booking.com
    url: https://www.booking.com/hotel/mx/now-jade-riviera-cancun.html
    status: quoted
    repriced: 2026-11-02
    checkin: 2027-01-03
    checkout: 2027-01-08
    nights: 5
    adults: 6
    group_shape: 2 couples and 2 singles
    checkin_time: "15:00"
    checkout_time: "12:00"
    board: All-inclusive. Meals, drinks and gratuities are in the room rate.
    review_score: 8.0
    review_count: 153
    operator: Hyatt Inclusive Collection
    url_note: >
      The Booking.com slug is the resort's old name, Now Jade Riviera Cancun.
      It is the same property. Hyatt rebranded it to Dreams Jade.

    # Chosen 28 October 2026. See docs/decisions.md.
    why_this_property: >
      A single large residence split between six people only works by arguing
      over who takes the sofa bed. Dreams Jade is a conventional resort:
      every pair gets a room with a door, the board is all-inclusive so there
      is no food estimate to carry, and the two singles can have their own
      rooms without anybody negotiating over a living room.

    # THE TRAP ON THIS PROPERTY. Read before touching any number here.
    tax_treatment:
      booking_quotes: pre-tax
      city_tax: included in the quoted price
      vat_percent: 16
      environmental_fee: none published for this property
      multiplier: 1.16
      note: >
        Booking.com prints "Included: City tax" and "Excluded: 16% VAT" on
        every rate at this property. Every figure in room_catalogue and
        combinations therefore carries both numbers: quoted_usd is what
        Booking displays, all_in_usd is that times 1.16. Combinations and the
        budget use all_in only.
        An earlier beach quote on this trip ran the other way, already
        tax-inclusive, and was grossed up anyway, overstating the lodging by
        about $250 each. Here the tax is genuinely excluded and must be
        added. Check which way round a quote is before doing arithmetic.
        AND NOW BOTH WAYS ROUND LIVE IN THIS FILE. Everything in
        room_catalogue and combinations is a Booking.com price and needs the
        1.16. The direct_quote block below is tax-inclusive and must not be
        touched. The resort said so in writing: the rates already include all
        applicable taxes. Multiplying $8,420 by 1.16 gives $9,767, which is
        a number that has never existed, and it would make the direct quote
        look worse than the Booking rate it actually beats.

    # THE REAL PRICE. Everything else on this property is a search page.
    # Quoted in writing by the resort's reservations desk on 2 November 2026,
    # in reply to the enquiry sent 30 October. Full text and the answers to
    # all six questions are in private/jade-quote.md.
    direct_quote:
      received: 2026-11-02
      build: four Junior Suites Ocean View, 3 to 8 January 2027, five nights
      tax_treatment: inclusive, do not apply the 1.16
      board: all-inclusive, food, drinks and gratuities in the rate
      rooms:
        - occupancy: 2
          count: 2
          nightly_usd: 468
          room_total_usd: 2340
        - occupancy: 1
          count: 2
          nightly_usd: 374
          room_total_usd: 1870
      total_usd: 8420
      per_person_usd: 1403          # split 6 ways, the repo convention
      per_person_couple_usd: 1170   # if each room pays its own way instead
      per_person_single_usd: 1870   # see budget.yml riviera.split_question
      single_discount_percent: 20.09
      versus_booking:
        flexible_all_in_usd: 9055
        direct_saves_usd: 635
        nonrefundable_all_in_usd: 7705
        direct_costs_more_usd: 715
        note: >
          The resort declined to match Booking, saying its rates are public
          and net. So the direct quote sits between the two: $635 under the
          flexible rate and $715 over the non-refundable one. The $715 buys a
          cancellation policy better than either, which is the trade to make
          for a group that has already changed shape twice and has not yet
          settled its own room build.
      cancellation: >
        Free if the cancellation is received at least 3 days before arrival.
        After that, or on a no-show, the penalty is one night. One night on
        all four rooms is $1,684, so that is the entire downside.
        The deadline is 30 December 2026, confirmed in writing on 3 November.
        Not 31 December, which is what counting three days back from a
        3 January arrival gives and which is what this file said until now.
        The resort counts a day tighter than we did. Work to 30 December.
      payment: >
        One night per room at booking, $1,684 across the four, with the
        balance payable at check-in. Confirmed in writing on 3 November that
        the Christmas and New Year full-prepayment exception does not apply
        to a 3 January arrival. So Ryan fronts $1,684 at booking rather than
        $8,420, and pays the remaining $6,736 at the desk on 3 January.
        Corrected 10 November 2026. This used to end "each couple and each
        single settles its own room at the desk", which stated the resort's
        billing schedule as though it were the group's arrangement. The whole
        $8,420 sits inside the $1,403 beach share and therefore inside the
        $2,346 set amount, so it is collected from everybody like every other
        line and Ryan presents one card for all four rooms. See
        set_amount_back_check in data/budget.yml.
      promotions: >
        Asked on 2 November about Black Friday, Cyber Monday and other
        seasonal offers. The resort has no confirmed information and does not
        expect the rates for these dates to move much. Treat $8,420 as the
        price rather than waiting for a sale that nobody has promised.
      price_after_booking: >
        No adjustment. If a lower rate appears after the reservations are
        confirmed, the resort will not reprice them. The only route to the
        lower rate is cancelling and rebooking, subject to availability.
        That is softer than it sounds, because cancellation is free until
        30 December: a better rate found before then can be taken by
        cancelling and rebooking at no cost. After 30 December it costs one
        night, $1,684, which no plausible rate drop would cover.
      adjacency: >
        They will note all four reservations so the front desk can try to
        place the group together. Not guaranteed, and conditional: all four
        rooms must be booked in the same category to have any chance of it.
        This kills every mixed-category combination below as a way of keeping
        the group together, and it is now the resort's own words rather than
        an inference from where the buildings sit.
      bed_type: >
        Four Kings, confirmed available subject to availability. Decided
        2 November: a King in every room, including both single-occupancy
        rooms. This must be stated on all four reservations, not assumed.
      birthday: >
        A complimentary room amenity for a special occasion, arranged by the
        Concierge team. Paid celebration packages exist if we want more.
      transfers: >
        The resort runs no transfer of its own. Its authorised operator is
        AMSTAR, to be contacted direct. Details in private/jade-quote.md.
        AMSTAR publishes no rate, so it was priced against the open market on
        3 November rather than taken on trust. A private van for all six,
        both directions, quotes at $100 on eTransfers' own site for the real
        dates, which is $16.67 each. Full comparison, including why Uber is
        not an option at this airport, is in docs/transport.md.
      not_answered:
        - >
          The Quintana Roo state tourist tax. The answer given covers the
          resort's own bill, and Visitax is paid to the state rather than to
          the hotel, so it is still owed and still unpriced for 2027.
          This is the only thing the resort was asked that it has not
          answered, and it is one it cannot answer: the levy is the state's.

    # Asked 2 November 2026, and the answer is no. Recorded so it is not
    # asked a third time.
    no_two_bedroom_units:
      question: Could six go into two larger suites with two bedrooms each?
      answer: no
      checked: 2026-11-02
      how: >
        Booking.com re-searched at 2 rooms and 3 adults rather than the 4 and
        6 used on 28 October, because a unit that sleeps three only surfaces
        when the search asks for three. Same eleven room types came back. The
        resort has no two-bedroom unit at any price or any view.
      every_suite_is_one_room: >
        Every description on the property reads "1 room". The Junior Suites,
        including every Ocean View one, are 700 square feet. The only suite
        with a separate bedroom is the Preferred Club Governor Suite, which
        is one bedroom and caps at two adults, so it cannot take three.
      the_near_miss: >
        The Family Suite is the only unit bigger than a Junior Suite. It is
        1,399 square feet with 2 full beds and 1 king, and it caps at four
        adults. It is still one room: three beds in a single space, not two
        bedrooms. It is also garden view, so it is not an ocean view option
        at all, and inventory showed one left for these dates, so two of them
        cannot be booked regardless.
      and_it_costs_more: >
        Priced anyway, for the record. Two Family Suites at three adults each
        is $5,694 a room before VAT on the flexible rate, so $6,605 all in
        and $13,210 for the pair. That is $4,790 more than the $8,420 quoted
        direct for four Ocean View Junior Suites, for a garden view and six
        people sleeping in two rooms instead of four.
      do_not_confuse: >
        "Two Double Beds" in a room name means one room containing two full
        beds. It does not mean two bedrooms. Four of the eleven types are
        named that way and all of them are single rooms that cap at three.
      conclusion: >
        Four rooms it is. The build does not change.

    # DECIDED 2 November 2026. This is the build. Nothing below changes it.
    build_decided:
      decided: 2026-11-02
      rooms: 4
      category: Junior Suite with Ocean View
      bed: King in all four
      adults: 6
      total_usd: 8420
      booked: false
      assignment:
        - room: 1
          who: hosts
          first_names: [Krysta, Ryan]
          occupancy: 2
          rate_usd: 2340
        - room: 2
          who: couple_a
          first_names: [Haley, Eddie]
          occupancy: 2
          rate_usd: 2340
        - room: 3
          who: single_a
          first_names: [Christian]
          occupancy: 1
          rate_usd: 1870
        - room: 4
          who: single_b
          first_names: [Bubba]
          occupancy: 1
          rate_usd: 1870
      must_be_on_the_reservation:
        - All four in the same category, which is what makes adjacency possible at all
        - A King bed in every room, including both single-occupancy rooms
        - A note on all four asking the front desk to place them together
        - Krysta's birthday on 2 January, for the complimentary amenity
      why_not_cheaper: >
        Three rooms would have been cheaper and would have broken no rule,
        but it puts the two single travellers in one room together. Four
        rooms was chosen so both of them get a door that closes. That is the
        whole premium and it was paid deliberately.
      why_not_mixed: >
        Mixing categories to save money now costs adjacency outright rather
        than just making it less likely. The resort said so in writing.
      why_not_bigger: >
        There is no two-bedroom unit at this property at any price. Checked
        2 November, see no_two_bedroom_units below.

    # The single biggest lever on this property.
    single_occupancy_rule:
      discount_percent: 20
      applies_to:
        - Junior Suite King Bed
        - Junior Suite Two Double Beds
        - Junior Suite with Ocean View King Bed
        - Junior Suite with Ocean View Two Double Beds
      no_discount_above: Preferred Club Junior Suite Tropical View King
      note: >
        A solo traveller pays 80 percent of the two-person rate on the four
        cheapest room types and 100 percent of it on everything above them.
        From Preferred Club Tropical View upward, including every Ocean Front
        and every Preferred Club room, one person pays the full two-person
        price for a phantom second guest.
        So the two singles go in an Ocean View room or below. Never put a
        single in an Ocean Front or a Preferred Club room. Verified at one
        adult and at six adults across four rooms on 28 October, and
        confirmed by the resort on 2 November at $374 against $468, which is
        20.09 percent. Worked out from a search page, then checked against
        the operator.

    # The thing that actually drives the bill, and it is not the ocean view.
    layout_problem: >
      Settled on 2 November 2026 in favour of four rooms. Kept because it is
      the reasoning behind the number everybody is being asked to pay.
      Six adults as two couples and two singles can be housed in three rooms
      or in four. Three rooms puts the two singles together in a Junior Suite
      Two Double, which is two separate beds and breaks no rule, at $966 each.
      Four rooms gives each single their own Junior Suite at $1,500 each.
      The fourth room is what costs money here. It is $534 more for each
      single, $1,067 to the group, which is more than four times what
      upgrading a couple from a standard suite to Ocean Front costs.
      The ocean view is the cheap part of this decision and the fourth room
      is the expensive part, which is the opposite of how it looks.
      Four won. Both single travellers get a door that closes, and that
      premium was paid deliberately rather than by accident.
    layout_recommended: >
      DECIDED 2 November 2026. Four rooms, every one of them a Junior Suite
      with Ocean View, every one with a King bed. Two rooms for the two
      couples and one each for the two single travellers. All four booked in
      the same category and requested adjacent.
      No mixed categories, and that is now the resort's rule rather than a
      preference: they confirmed on 2 November that all four rooms must be in
      one category for the front desk to even attempt to place the group
      together. Every cheaper build on this page buys a group scattered
      across the property.
      $8,420 for the four rooms, quoted direct. Nothing is booked yet.

