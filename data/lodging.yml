    # Reconciled 27 October 2026 against a screenshot Ryan took of the same
    # search. His figures were uniformly about 20 percent higher than the
    # engine returns today, across all six units and all six all-inclusive
    # supplements. Re-ran his exact search, 2 adults for the same dates, and
    # got today's numbers back, so headcount is not the cause: the engine
    # prices a unit the same at 2, 4 and 6 adults. The cause is the discount
    # tier. See discount_tiers.
    discount_tiers:
      current:
        percent: 32
        seen: 2026-10-27
        note: >
          What the engine returns today on the non-refundable rate, confirmed
          twice in the same session at 2 adults and at 6 adults. The flexible
          rate runs 20 percent off rack at the same time.
      shallower_tier_seen:
        approx_percent: 18
        source: Ryan's screenshot of the same search
        note: >
          Derived, not quoted. His prices divide out to roughly 0.82 of the
          rack rates this file records, consistently to within a few dollars
          on every unit, and his all-inclusive supplements are higher by the
          same factor. Rack rates themselves match exactly, which is what
          makes the comparison safe.
      what_it_means: >
        Two discount tiers exist for these dates and the deeper one is live
        now. A Black Friday badge is running on the operator's own site,
        which is the likeliest explanation, though no end date is published
        anywhere we can see. Treat 32 percent as borrowed rather than owned.
        If it lapses back to the shallower tier, the recommended two unit
        layout goes from $5,827 to about $7,023 non-refundable, which is
        roughly $199 more per person. The residence on its own goes from
        $4,037 to about $4,859, about $137 more each.
        This is the sharpest argument yet for booking the flexible rate
        early: it refunds in full until 13 December and locks the discount.

    price_moved_in_our_favour: >
      These dates are cheaper than when they were last checked on 2 October.
      The Two Bedroom Oceanview Residence was $4,525 non-refundable and $5,323
      flexible. It is now $4,037 and $4,749, so the residence alone fell $488
      and $574. That is most of what the Junior Suite costs, which is why
      fixing the sleeping arrangement is affordable now and was not before.

    three_bedroom_not_available: >
      The property publishes a Three Bedroom Oceanfront Residence that would
      solve this in one unit. It does not appear in the engine for these dates
      at any headcount, searched at 6, 7 and 8 adults on 27 October. This
      matches what was found on 2 October, when the Oceanfront's three bedroom
      was already sold out for these dates and the sister property still had
      inventory, so it is most likely genuinely gone rather than withheld from
      online sale. Worth one email before settling for two units.

    loyalty_discount:
      percent: 5
      note: >
        is offered at the room selection step to anyone with a prior Fives
        booking, or on signup. The dollar value this page used to print was
        5 percent of the old, higher residence rate and is now wrong, so it
        has been removed rather than guessed at. Apply it at booking and see
        what comes off.
    flexible_terms: Free cancellation, refundable until 13 December 2026
    recommended_rate: flexible
    tax_breakdown_seen:
      subtotal_usd: 3336
      vat_21_usd: 701
      total_usd: 4037
      note: >
        The engine prints "Taxes included" and shows the VAT inside the total.
        Earlier planning grossed these quotes up by 21% on top, overstating
        the beach lodging by about $250 each. Do not gross up engine quotes.
    contact:
      email: reservations@thefiveshotels.com
      us_can: "+1 800 592 1246"
      direct: "+52 998 580 0100"
    why_jan_3:
      - The Fives runs a holiday rate band 24 Dec 2026 to 2 Jan 2027, with the next band starting exactly 3 January
      - The identical unit is $7,895 for 29 Dec to 3 Jan versus $4,990 for 3 to 8 Jan
      - A stay including 2 January has no all-inclusive board available at all
    no_traps_confirmed:
      - No resort fee
      - No reservation fee
      - No New Year's Eve gala charge
      - Only holiday charge is a 25 December gala at $100 per adult, which 3 January clears by nine days
    open:
      - Which of the three layouts the group wants, which is the only thing holding up the booking
      - Whether the Three Bedroom Oceanfront Residence can be sold for these dates
      - Whether the resort runs its own private airport transfer, and what it costs for six
      - Environmental tax at check-in, sources conflict between under $25 for the stay and up to $270
      - >
        Whether the 32% and 20% rates survive to booking. A shallower tier of
        about 18% has been seen on the same search, so this is a real risk
        rather than a formality. See discount_tiers.
      - Whether the discount stacks with the 5% loyalty discount
      - Kitchen items surcharge if anyone plans to cook

