# BOOKED 18 October 2026. The confirmation code, street address, host phone
# and payment links live in private/casa-km-booking.md, which is gitignored.
# Headcount settled at 7 sharing (3 couples plus 1 single); the 8th traveller
# is booking their own hotel. Priced at 7 guests on the listing page itself.
cdmx_front_runner:
  name: Casa KM
  subtitle: 4BR Penthouse with Private Rooftop
  neighborhood: Del Valle Norte
  platform: Airbnb
  listing_id: "881238784886784781"
  url: https://www.airbnb.com/rooms/881238784886784781
  status: booked
  booked: 2026-10-18
  verified: 2026-10-18
  checkin: 2026-12-29
  checkout: 2027-01-03
  nights: 5
  guests: 6
  capacity: 7
  total_usd: 3837
  per_person_usd: 639
  all_in: true
  price_breakdown:
    nightly_usd: 634.20
    nights: 5
    # Airbnb prints the nightly as a rounded display: 634.20 x 5 is 3,171.00,
    # two cents under the subtotal it charges. The subtotal is authoritative.
    subtotal_usd: 3171.02
    taxes_usd: 665.91
    total_usd: 3836.93
  payment_schedule:
    - date: 2026-10-18
      amount_usd: 1585.51
      status: paid
    - date: 2026-12-14
      amount_usd: 2251.42
      status: scheduled
  rate_rose_before_booking: >
    Quoted all in at $2,944 on 12 October, paid $3,836.93 on 18 October, which
    is $893 more. The receipt is $634.20 a night before tax against roughly
    $490 implied by the earlier quote, so the nightly rate rose about 29
    percent in six days. Holiday inventory tightening is the likely cause and
    it cannot be verified after the fact. Treat the $2,944 figure as dead.
  bedrooms: 4
  beds: 4
  baths: 4.5
  baths_note: Every bedroom has its own full bathroom, plus a guest half bath.
  rating: 4.99
  reviews: 139
  checkin_time: "16:00"
  checkout_time: "11:00"
  wifi_mbps: 433
  parking: 2 covered spaces
  bed_config:
    - bedroom: 1
      bed: King
      extras: En-suite bath, closet, balcony, hammock, Smart TV
    - bedroom: 2
      bed: Queen
      extras: En-suite bath, closet, balcony
    - bedroom: 3
      bed: Queen
      extras: En-suite bath, closet, balcony
    - bedroom: 4
      bed: Full
      extras: En-suite bath. No balcony or closet. Host lists it as best for one guest.
  room_plan: >
    Two couples take the king and one queen, both with their own balcony and
    bathroom. The two singles take the other queen and bedroom 4. Nobody shares
    a bedroom and nobody shares a bathroom.
  roof: >
    Private rooftop one level up, with outdoor furniture, a shaded dining area,
    a grill, a stationary bike and open city views that reach the volcanoes on
    clear days.
  distance_km:
    roma_norte_core: 2.2
    parque_mexico: 1.5
    em: 1.6
    pujol: 4.7
  cancellation:
    actual: Free for 24 hours after booking, then partial refund only until 16:00 on 22 December 2026, listing local time
    warning: >
      The free window has already closed. Until 22 December only a partial
      refund is available and after that nothing, so the money is committed.
      The second payment of $2,251.42 lands on 14 December, eight days ahead
      of that cliff.
  why_chosen:
    - Four bedrooms, each with its own full bathroom, so both couples and both singles get a private bath
    - Bedroom 4 is purpose-built for a single guest, which suits one of the two singles
    - Balconies off three of the four bedrooms, the direct fix for the Oasis airflow complaints
    - Private rooftop with a grill and shaded dining, so we keep the thing the Oasis was worth
    - 4.99 from 139 reviews is the strongest record of anything checked on these dates
    - Gas stove, oven and a full kitchen, so the New Year's Eve plan survives
    - Smoke detectors in every bedroom, a carbon monoxide alarm, three fire extinguishers and a first aid kit
    - Washer and dryer in unit, 433 Mbps wifi, two covered parking spaces
  house_rules:
    quiet_hours: "22:00 to 08:00"
    pets: allowed
    max_guests: 7
  safety_on_confirmation:
    - Exterior security cameras on the property
    - Carbon monoxide alarm
    - Smoke alarm
  flags:
    - >
      Quiet hours run 22:00 to 08:00. This was not in the listing's rules
      summary and surfaced only on the confirmation. The New Year's Eve plan
      puts midnight on the rooftop, which sits squarely inside that window,
      so that plan needs either rethinking or an explicit agreement with the
      host. See the New Year's Eve page.
    - Exterior security cameras on the property, so treat the outside as recorded
    - Seven guests maximum, which leaves one spare place
    - The nightly rate rose about 29 percent between the 12 October quote and booking
    - Cancellation is free for 24 hours only, then partial refund until 22 December
    - Three levels joined by interior stairs, and the elevator only reaches the middle one
    - No air conditioning and no central heating, just portable fans and extra blankets. January nights run about 45F.
    - Del Valle Norte reads as far but is not; it is closer to Em and Parque Mexico than the Oasis is
  runner_up_note: >
    The 4BRM Coolest flat in Heart of Condesa was the alternative at $760 each
    and is no longer in play. Cheaper options existed when we booked, the
    lowest at $307 each; the decision log records why Casa KM won on bathrooms
    and review record rather than on price.
