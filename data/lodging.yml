      of that cliff.
  why_chosen:
    - Four bedrooms, each with its own full bathroom, so both couples and both singles get a private bath
    - Bedroom 4 is purpose-built for a single guest, which suits one of the two singles
    - Balconies off three of the four bedrooms, which was the fix for the airflow complaints that sank the runner up
    - Private rooftop with a grill and shaded dining, which was the one thing the alternative had going for it
    - 4.99 from 139 reviews is the strongest record of anything checked on these dates
    - Gas stove, oven and a full kitchen, so the New Year's Eve plan survives
    - Smoke detectors in every bedroom, a carbon monoxide alarm, three fire extinguishers and a first aid kit
    - Washer and dryer in unit, 433 Mbps wifi, two covered parking spaces
