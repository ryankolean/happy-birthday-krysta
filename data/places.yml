      Rated 9/10 by @placesnoted and starred by @thatonepointofview as actually
      eaten. Trompo-style pastor over open flame. The one where the hype and
      the plate agree.
    source: instagram @placesnoted, @thatonepointofview

  - name: Tacos La Once Mil
    category: taco
    lat: 19.4199507
    lon: -99.160306
