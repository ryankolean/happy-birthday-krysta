  - name: Tacos del Valle
    category: taco
    michelin: bib
    protein: [pork]
    address: Tacos del Valle, Ciudad de Mexico
    note: >
      Rated 9/10 by @placesnoted and starred by @thatonepointofview as actually
      eaten. Trompo-style pastor over open flame. The one where the hype and the
      plate agree. Three trompos, spicy pork, pork belly and carne asada, but the
      pick is the steak and bone marrow taco. Expect a long line.
      Two more posters put numbers on that line: two hours on one visit, and
      forty five minutes for the pork belly alone on another. Both said it was
      worth it, and the second named the red and the black pork belly tacos.
      A commenter on the second rated the flautas the best thing they ate in
      ten days in the city. This is now the longest documented wait on this
      page, which makes it a plan rather than a drop in.
    source: instagram @placesnoted, @thatonepointofview, @thecaroandtina, @d.stvns, @bostoneatin

  - name: Tacos La Once Mil
    category: taco
    michelin: 1
    protein: [beef]
    address: Orizaba 83, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Rated 10/10. Wood-fired Wagyu, filet mignon and Prime skirt, tortillas
      made to order, spicy tuna tostada. Pricier than a normal taqueria. The
      wagyu taco is the one to order and the picanha off the trompo is
      skippable.
      It won one Michelin star in the 2026 guide, the star El Califa de Leon
      lost, and it is the only taqueria in the country holding one. Read the
      badge on this pin with one caveat: there are two branches, and the guide
      lists the Lomas de Chapultepec one at Monte Everest 780. This pin is the
      Roma Norte branch at Orizaba 83, same taqueria and same kitchen, and it
      is the one a friend in the city meant by "the taco spot next to Rosetta".
      The pin used to sit on a name lookup with no street number at all.
    source: instagram @placesnoted, @thecaroandtina, friend in Mexico City, November 2026

  - name: Tacos Atarantados
    category: taco
