# Every place we might eat, drink, or go, plus where we are staying.
#
# TO ADD A PLACE: append an entry with at minimum `name`, `category` and
# `address`, then run `npm run geocode` to fill in lat/lon, then `npm run build`.
# Entries that already have coordinates are left alone.
#
# category must be one of the keys in `categories` below.
# precision: exact | approximate   (approximate draws a hollow marker)

categories:
  stay:
    label: Where we are staying
    color: "#C06A05"
  fine:
    label: Fine dining
    color: "#0F5C57"
  casual:
    label: Casual food
    color: "#2E8B6F"
  bar:
    label: Bars and drinks
    color: "#6B4E9E"
  market:
    label: Markets and food pickup
    color: "#B5541F"
  taco:
    label: Tacos and street food
    color: "#C23B22"
  spot:
    label: Parks, shops and sights
    color: "#4A6FA5"

places:
  # ---------- where we are staying ----------
