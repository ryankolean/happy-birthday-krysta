  # ---------- tattoo shops in the village, checked 10 November 2026 ----------
  # Krysta and Ryan want the option of getting something on Thursday 7 January,
  # the last full day. Only the two shops with a real review history are here.
  # Four others exist in town (Tattoo House by Pekas, Mermaid Tattoo, A Gogo,
  # Jazmink MTL, which shares MTL's address) and all have fewer than ten
  # reviews, so they are leads rather than options. Cancun has much bigger
  # shops, Moon Ink at 1,325 reviews and Tattoo Shop Company at 536, but that
  # is a 30 to 40 minute drive each way and the two below are in the village.
  - name: MTL Tattoo Caribe
    category: spot
    address: Calle Adolfo Lopez Mateos, Puerto Morelos, Quintana Roo, Mexico
    lat: 20.8506341
    lon: -86.875398
    neighborhood: Puerto Morelos centro
    note: >-
      5.0 from 115 Google reviews, the most reviewed shop in the village. Thursday
      11 am to 7 pm, so open for all of 7 January. Several artists rather than one
      chair, which is what makes two tattoos in one afternoon plausible. Reviews
      repeat clean line work, a clean studio and fair prices. The MTL is Montreal:
      the shop is the Caribbean arm of @mtltattoo there, which is why reviewers
      say English was not a problem. Shop phone +52 998 871 0048, WhatsApp
      +52 998 150 5587. Nothing is booked and no design exists yet, so price and
      chair time are both unverified.
    artists_note: >-
      Five on the shop's own Instagram bio, checked 10 November 2026, each with a
      portfolio to judge before picking. A Google reviewer also praises an artist
      called Mar de Fondo, who is not in the current bio roster, so ask rather
      than request them by name.
    artists:
      - handle: vitaminafunk
        name: Luis Olivares
        does: >-
          Neo traditional and illustrative, custom designs. Books by DM.
      - handle: mohnattt
        name: Mohna Solange
        does: >-
          Resident. Blackwork, tattooing since 2013. Books by DM and posts
          available flash under a Disponibles highlight.
      - handle: rivastattooer
        name: Rivis
        does: >-
          Caribbean styles. The largest following of the five at 8,700, with a
          bookings highlight.
      - handle: jazzm_ink
        name: Jaz
        does: >-
          Has her own Google listing at the same address, 5.0 from 4 reviews,
          women owned. Thursday 11 am to 7 pm, closed Mondays and Tuesdays.
      - handle: eilo_tattoo
        name: Eilo
        does: >-
          Neo traditional and neo Japanese, out of Montreal. Highlight reads
          Guest 2026, so a visiting artist to confirm rather than a resident to
          count on.
    booking: >-
      The bio says walk-ins welcome, but 7 January is peak season and two people
      is two chairs, so DM the shop or the artist first. Luis and Mohna both say
      DM for appointments.
    url: https://www.instagram.com/mtltattoocaribe/
    region: riviera
  - name: Tattoo Shack
    category: spot
    address: Avenida Javier Rojo Gomez, Puerto Morelos, Quintana Roo, Mexico
    lat: 20.8460776
    lon: -86.8783723
    neighborhood: Puerto Morelos centro
    note: >-
      5.0 from 71 Google reviews, on the main village street. Thursday noon to
      9 pm. One artist, who goes by Stinky, with repeat visitors who come back
      every trip; the work shown is mostly black and grey, with some colour.
      Reviewers describe walking in and being in the chair 45 minutes later, and
      one says outright to make an appointment because the shop is getting busy.
      A single chair means two people is two sittings, not two at once. Phone
      +52 998 844 0823.
    artists_note: >-
      One artist. That DM is the only quoting channel here, so there is no
      published price list to compare against MTL without asking.
    artists:
      - handle: one_stinky
        name: Stinky
        does: >-
          500 posts and 2,100 followers. Bio says to message him for prices and
          a consultation. Mostly black and grey per the reviews.
    booking: Message @one_stinky on Instagram ahead of 7 January
    url: https://www.instagram.com/one_stinky
    region: riviera

  # ---------- a friend's list from Mexico City, 8 November 2026 ----------
  # Sent by a friend who is in the city now and exploring on our behalf.
  # First-hand recommendations rather than reels or listicles, which makes
  # this the best sourced batch on this page. Names came through as the friend
  # typed them, so several turned out to be places already listed under a
  # different spelling, and two could not be identified at all. See
  # docs/open-questions.md.
  - name: Meroma
    category: casual
    michelin: listed
    address: Colima 150, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Mid-scale contemporary, Italian and Mediterranean cooking on a Mexican
      base. The friend has loved every dish here, which is a stronger claim
      than anything else on this page gets. Michelin lists it without a star.
      Same block as Rosetta at 166 and Panaderia Rosetta at 179, so it pairs
      with the bakery on a Roma Norte morning.
      Hours conflict: one listing says Monday to Saturday 13:00 to 23:00 and
      Sunday to 22:00, another says closed Mondays. Unverified.
    booking: OpenTable. +52 55 5920 2654.
    source: friend in Mexico City, November 2026
  - name: Azul Historico
    category: casual
    address: Isabel la Catolica 30, Centro, Cuauhtemoc, 06000 Ciudad de Mexico
    neighborhood: Centro
    note: >
      Mid-scale regional Mexican, in the courtyard of the Downtown Mexico
      building. Ricardo Munoz Zurita's kitchen, and he is the person who
      spent decades cataloguing regional Mexican ingredients, so the menu
      rotates by region rather than by season.
      Order the guacamole with chapulines, grasshoppers. The friend calls it
      truly delicious and also rated the steak. Reported 09:00 to 23:00 daily,
      unverified.
      The friend wrote only "Azul", and there are three: this one in Centro,
      Azul Condesa on Nuevo Leon, and the original Azul y Oro on the UNAM
      campus. This is the one visitors normally mean and the only one with a
      confirmed street number, so it is the one pinned. Worth asking which
      they ate at before anybody plans around the courtyard.
    source: friend in Mexico City, November 2026
  - name: Mercado de San Juan
    category: market
    address: Mercado de San Juan Ernesto Pugibet, Centro, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Centro
    note: >
      Specialty food market, the one where the vendors carry things the other
      markets do not. Known for exotic meats, which one guide lists as far out
      as lion and penguin, and for imported cheese. Go hungry, and bring cash,
      because not every stall takes a card.
      This is the chirimoya errand. Ask around the fruit vendors for one, they
      are reported to be helpful about pointing you at whoever has it, and ask
      for one ready to eat today or tomorrow. It looks alarming, has big seeds
      and a pulpy centre to avoid, and the white flesh is the point. Mercado
      Medellin is the fallback and is closer to the house.
      Hours conflict, 09:00 to 17:00 on one listing and 11:00 to 18:00 on
      another, daily either way. Unverified. Bring cash, not every stall
      takes a card.
      Addresses are a mess here. Listings variously give Ernesto Pugibet 21,
      2a Calle de Ernesto Pugibet, and postal codes 06070 and 11580. Geocoding
      the street number landed on a restaurant called La Cocina de San Juan
      about 150 m away, so this pin is the market looked up by its own name
      instead. Trust the name, not the number.
    source: friend in Mexico City, November 2026
  - name: Bosforo
    category: bar
    address: Luis Moya 31, Centro, Cuauhtemoc, 06010 Ciudad de Mexico
    neighborhood: Centro
    precision: approximate
    note: >
      Mezcal bar, reported 40 plus small-batch artisan mezcals. No sign on
      the street: look for the red curtain on Luis Moya and go through it.
      The friend's instruction is to get there right when it opens, take a
      seat at the bar, and let the bartenders walk you through flavours until
      you find what you like. That only works with a seat at the bar, so it
      is an opening-time plan and not a late one.
      A block or so off the Alameda, walkable from Hidalgo, Bellas Artes or
      Juarez metro. Hours conflict badly: one source says Tuesday 19:00 to
      02:30, Wednesday to 23:00, Thursday to Saturday to 02:30, another says
      Tuesday to Saturday 18:00 to 02:00. Unverified, and a group of seven at
      the bar is optimistic.
    source: friend in Mexico City, November 2026
  - name: Pulqueria Las Duelistas
    category: bar
    address: Aranda 28, Centro, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Centro
    precision: approximate
    note: >
      Pulque, the fermented agave drink, usually served flavoured as curados.
      Painted floor to ceiling in murals. On the corner with Vizcainas,
      between Ayuntamiento and Puente Peredo.
      The friend is honest about this one: glad to have tried a few flavours,
      does not seek it out on later trips. So one round as an experience
      rather than an evening.
      Reported Monday to Saturday 10:00 to 21:00, though one source says
      daily and another says closed Sundays. Unverified. Cash only.
    source: friend in Mexico City, November 2026
  - name: Pulqueria Los Insurgentes
    category: bar
    address: Avenida Insurgentes Sur 226, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      The other pulqueria on the friend's list and the easier one to reach
      from the house. Several floors, flavoured pulques, a rooftop terrace
      with a stage, jazz midweek and salsa at weekends. Same caveat as Las
      Duelistas: worth trying once.
      Hours conflict across listings, roughly 13:00 or 14:00 to between 01:00
      and 03:00, later at weekends. Unverified. One listing puts it in San
      Rafael, which every other source contradicts.
    source: friend in Mexico City, November 2026
  - name: La Rifa Chocolateria
    category: casual
    url: https://www.facebook.com/larifachocolateria
    address: Dinamarca 47, Juarez, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Juarez
    note: >
      Drinking chocolate, cacao from Tabasco, Chiapas, Guadalajara and
      Ensenada. The friend's non-alcoholic pick.
      Listings disagree: Dinamarca 47 in Juarez is the best attested, while
      several guides give a Roma Norte address that on closer reading belongs
      to a different shop. Treat Juarez as the one and confirm before
      walking.
    source: friend in Mexico City, November 2026
  - name: Arena Coliseo
    category: spot
    address: Republica de Peru 77, Centro, Cuauhtemoc, 06010 Ciudad de Mexico
    neighborhood: Centro
    note: >
      Lucha libre. The older and smaller of the two city arenas, about 5,250
      to 5,550 seats, and the one the city calls the original home of lucha
      libre here. Nearest metro Allende.
      This is where the 29 December evening may end up: the booked experience
      walks the group to either Arena Mexico or here, and the confirmation
      does not say which. The friend's line is that it is an experience, which
      matches why it was booked.
    source: friend in Mexico City, November 2026
  - name: Tacos La Chula
    category: taco
    address: Avenida Insurgentes Sur 454, Roma Sur, Cuauhtemoc, 06760 Ciudad de Mexico
    neighborhood: Roma Sur
    precision: approximate
    note: >
      On the friend's list as "La chula" with no branch given, and there are
      at least three: this one on Insurgentes Sur in Roma Sur, one at
      Liverpool 102 in Juarez that gets the written-up reviews and is reported
      open around the clock, and one on Avenida Revolucion in Escandon. A
      separate La Chula Taqueria on Astronomos rates poorly and is probably
      not related.
      Pinned at the Roma Sur branch because it is the closest of the three to
      the house. Ask the friend which one they meant before building an
      evening on it.
    source: friend in Mexico City, November 2026
  - name: Quentin Cafe
    category: casual
    url: https://quentin.mx/
    address: Avenida Alvaro Obregon 64, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Specialty coffee, four branches around Roma and Condesa: this one on
      Alvaro Obregon, Amsterdam 67a in Hipodromo, Yucatan 93 in Roma Norte and
      Bruselas 11 in Juarez. Alvaro Obregon is the most cited and is pinned.
    source: friend in Mexico City, November 2026
  - name: Cafe Memorias de una Barista
    category: casual
    address: Frontera 83, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Tiny specialty roaster on a quiet stretch of Roma Norte, four small
      tables. Founded by a barista who also teaches latte art, so it is a
      coffee-first room rather than a cafe to sit and work in.
      Listings give the unit as 83, 83B or 83 local A, and the name appears
      both as "una barista" and "un barista". Same place.
    source: friend in Mexico City, November 2026
  - name: Almanegra Cafe
    category: casual
    address: Tonala 53, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Third-wave roaster. Addresses conflict across guides, with Tonala 53
      the most repeated and Cordoba 132 and a Tabasco street address also
      claimed. Tonala is pinned. Confirm before a detour.
    source: friend in Mexico City, November 2026
  - name: Blend Station
    category: casual
    address: Blend Station, Tamaulipas, Condesa, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Condesa
    precision: approximate
    note: >
      A small chain, four branches: Tamaulipas 60 and Amsterdam 282 in
      Condesa, Puebla 237 in Roma Norte and Horacio 256 in Polanco. The
      Condesa one is pinned, though one listing gives Tamaulipas 121 instead
      of 60, so check the number on the door.
      The one on this list most likely to work for a group that wants to sit
      down for a while.
      Pinned by venue name on Avenida Tamaulipas rather than by house number,
      because Tamaulipas 60 did not resolve at all and Tamaulipas 121 is the
      competing claim. So the pin is the right shop on the right avenue, not
      a confirmed door.
    source: friend in Mexico City, November 2026
  - name: Chiquitito Cafe
    category: casual
    address: Alfonso Reyes 232E, Condesa, Cuauhtemoc, 06140 Ciudad de Mexico
    neighborhood: Condesa
    precision: approximate
    note: >
      One of the first specialty coffee shops in Condesa, open since about
      2012, husband and wife run. Beans from a Veracruz roaster.
      Alfonso Reyes 232E is the original and is pinned. A second Condesa
      address at Agustin Melgar 43 shows on a delivery listing and may be a
      newer branch, and there is now one in Lomas de Chapultepec.
    source: friend in Mexico City, November 2026
  - name: Anvil Cafe de Especialidad
    category: casual
    address: Zamora 79, Condesa, Cuauhtemoc, 06140 Ciudad de Mexico
    neighborhood: Condesa
    note: >
      Small specialty cafe, V60 and Chemex, espresso tonic and a pistachio
      cream coffee on the menu. Outdoor seating. Reported Monday to Friday
      08:00 to 20:00, Saturday from 09:00, closed Sunday, unverified.
      Ratings are high but on few reviews. One directory files it under San
      Miguel Chapultepec while giving the same Condesa address, and the
      geocoder agrees with the directory: Zamora 79 resolved into San Miguel
      Chapultepec, postal code 11850, not Condesa 06140. Calle Zamora runs
      along the boundary, so both labels are defensible and the house number
      matched. Walk to the number, not to the colonia.
    source: friend in Mexico City, November 2026
  - name: Constela Cafe
    category: casual
    url: https://constelacafe.com/
    address: Colima 209, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Specialty coffee in the middle of Roma Norte, on the same street as
      Rosetta, Panaderia Rosetta and Meroma. Chocolate babka and the cinnamon
      roll with lemon glaze are the repeated food picks, pineapple coffee and
      the cortado the drink ones.
      Reported Monday to Thursday 08:00 to 20:00, Friday to Sunday to 21:00.
      The one real warning in the reviews: several of the signature drinks are
      often unavailable, and service runs slow. About 4.0 on roughly 1,170
      Google reviews, which is the weakest score of the coffee places here.
    source: friend in Mexico City, November 2026

  # ---------- fifteen Instagram posts, watched 9 November 2026 ----------
  # Ryan sent a batch of saved posts to be watched rather than skimmed, so
  # each of these came off a frame, a caption or a carousel slide rather than
  # off a search result. Where a post only corroborated a place already on
  # this page, the specifics went onto that entry instead of making a
  # duplicate. Sources are named by handle so a claim can be traced back.

  # The tuna tostada tour, @marguga__. One poster ate a tostada de atun at
  # thirteen places and published the roster by area. Eleven were new here.
  - name: Campobaja
    category: casual
    michelin: listed
    protein: [seafood]
    address: Colima 124, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Ensenada style Baja seafood, in the Michelin guide, on the same Roma
      Norte block as Meroma and Constela. The menu changes daily, so the
      tostada de atun is not guaranteed. Hours conflict: OpenTable says lunch
      13:00 to 18:00 Tuesday to Saturday and dinner to 23:00, Time Out says
      13:00 to 01:00. Reserve at the weekend.
    source: instagram @marguga__

  - name: Entremar
    category: casual
    url: https://entremar.com/
    michelin: listed
    protein: [seafood]
    address: Hegel 307, Polanco, Miguel Hidalgo, 11560 Ciudad de Mexico
    neighborhood: Polanco
    precision: approximate
    note: >
      Gabriela Camara's Polanco seafood room, the sibling of Contramar. The
      tostada is tuna with chipotle, avocado and crisp fried leek. Hours
      conflict between listings, roughly 12:00 or 13:00 to 19:00 or 20:00
      daily. Cross street Masaryk and Horacio, walkable from Polanco metro.
    source: instagram @marguga__

  - name: Voraz
    category: casual
    protein: [seafood]
    address: Aguascalientes 93, Roma Sur, Cuauhtemoc, 06760 Ciudad de Mexico
    neighborhood: Roma Sur
    precision: approximate
    note: >
      Contemporary gastrocantina. One local blog calls this the best tuna
      tostada in the city outright and also names the machaca salad and the
      mussels. A dissenting review says the tostada is excellent and the rest
      of the menu is average, which is useful to know before booking a group
      dinner here. Reported Wednesday to Saturday 18:00 to 01:00, Sunday to
      19:00. Reservation advised.
    source: instagram @marguga__

  - name: Ultramarinos de Mar
    category: casual
    michelin: bib
    protein: [seafood]
    address: Merida 21, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Lucho Martinez's seafood place, a 2025 Michelin Bib Gourmand. One older
      guide gives Durango 200 instead, which is Contramar's address, so trust
      Merida 21.
    source: instagram @marguga__

  - name: Abrasamar
    category: casual
    address: Merida 101, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Gulf of Mexico cooking, Tabasco, Campeche and Yucatan, chef Fernando
      Marrufo. Four doors and one block from Ultramarinos de Mar on the same
      street, so check the number. Reported 12:00 to 18:00 Sunday to Tuesday
      and 12:00 to 22:00 Wednesday to Saturday.
    source: instagram @marguga__

  - name: Caracol de Mar
    category: casual
    url: https://caracoldemar.com.mx/
    michelin: bib
    protein: [seafood]
    address: Campeche 340, Hipodromo, Cuauhtemoc, 06100 Ciudad de Mexico
    neighborhood: Hipodromo
    note: >
      Mexican and Peruvian seafood from the Contramar group, chef Alvaro
      Vasquez, Michelin Bib Gourmand 2024. One write up places it in a
      restored mansion in the Centro Historico, which contradicts the
      Campeche 340 address every booking listing gives. The booking listings
      win. Reported Monday to Saturday 13:00 to 22:00, Sunday to 19:00.
    source: instagram @marguga__

  - name: Taller de Ostiones
    category: casual
    protein: [seafood]
    address: Versalles 113, Juarez, Cuauhtemoc, 06600 Ciudad de Mexico
    neighborhood: Juarez
    note: >
      Oyster bar inside Casa Versalles, a few minutes from Handshake. Only
      one directory carries it, so treat the hours as soft: reported midday to
      20:00 daily, Sunday to 18:30.
    source: instagram @marguga__

  - name: Botanico
    category: casual
    michelin: listed
    protein: [seafood]
    address: Alfonso Reyes 217, Hipodromo, Cuauhtemoc, 06100 Ciudad de Mexico
    neighborhood: Hipodromo
    note: >
      Hipodromo, not Roma, despite where most lists file it. Diners name the
      tuna tostadas and the grilled oysters. Two doors from Chiquitito Cafe
      on the same street.
    source: instagram @marguga__

  - name: El Tibur
    category: casual
    protein: [seafood]
    address: Avenida Amsterdam 113, Hipodromo, Cuauhtemoc, 06170 Ciudad de Mexico
    neighborhood: Hipodromo
    note: >
      New seafood bar on the Amsterdam loop, chefs German Carballo and Luis
      Solano. Crudos, tostadas and a short bar rather than a dining room.
      Pickled mackerel with white ponzu and garlic oil is the dish the
      critics name. Postal code is given as both 06100 and 06170. Reported
      Wednesday to Friday afternoons and 12:00 to 20:00 at the weekend.
    source: instagram @marguga__

  - name: La Bonvi
    category: taco
    protein: [beef]
    address: Pedregal 33, Lomas de Chapultepec, Miguel Hidalgo, Ciudad de Mexico
    neighborhood: Lomas de Chapultepec
    precision: approximate
    note: >
      Cesar de la Parra's second taqueria, by the same chef as Tacos La Once
      Mil, known for the picana taco. One listing puts it at Anatole France
      139 in Polanco instead; the Lomas address has more sources behind it.
      Note this is well north of the house, a ride rather than a walk.
    source: instagram @marguga__

  - name: Fugu Sushi
    category: casual
    address: Avenida Mazatlan 30, Condesa, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Condesa
    precision: approximate
    note: >
      Identified from a slide that read only FUGU. Three places in the city
      carry that name and none of them is documented as serving a tuna
      tostada, so this is the most defensible guess rather than a confirmed
      match: an eight seat counter in Condesa, walk in only, no reservations,
      which fits a tostada tour better than the two suburban sushi branches
      do. See docs/open-questions.md. Eight seats means it does not work for
      this group anyway without splitting.
      Number 30 on Mazatlan resolves exactly but comes back labelled as a
      bookshop, which is one more reason this one is marked approximate.
    source: instagram @marguga__

  # Bakeries and coffee, from @emily.sav, @d.stvns and @dfgmuyjvbqg
  - name: Panaderia Brulee
    category: casual
    address: Chihuahua 181, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    precision: approximate
    note: >
      The only place on this page recommended by two unrelated posters in the
      same batch, both of them explicitly against the Rosetta consensus. One
      calls it a literal hole in the wall and the best pastries of their
      visit, naming the Paris Brest cruffin and the chocolate brioche bun with
      fruit and cream. The other puts it above Panaderia Rosetta outright.
      Croissants reported out warm about 09:30, a couple of street side seats
      only. Spelled Brule on both posts and Brulee on the listings.
      One caution on the pin: number 181 resolves exactly, but OpenStreetMap
      labels that door Pancracia Panaderia, a different and also well known
      Roma Norte bakery. Either Brulee took the site over or one of the two
      records is stale. Right block, probably the right door, so marked
      approximate until somebody stands in front of it.
    source: instagram @emily.sav, @dfgmuyjvbqg

  - name: Cafe Nin
    category: casual
    url: https://www.instagram.com/cafe_nin/
    address: Havre 73, Juarez, Cuauhtemoc, 06600 Ciudad de Mexico
    neighborhood: Juarez
    note: >
      Elena Reygadas again, in the old second Panaderia Rosetta site. Used as
      a breakfast stop on a 48 hour itinerary that also hit Cuina and
      Panaderia Rosetta. Listings split between Havre 73 and Havre 69, with
      73 better supported. Hours disagree too, earliest open 07:00.
    source: instagram @d.stvns

  - name: Cafe Margarita
    category: casual
    address: Cordoba 87, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Singled out for the room rather than the coffee: a historic house with
      a terrace and several indoor salons, inside Casa Margarita. MX$310 to
      500 a head, which makes it a sit down rather than a coffee stop.
    source: instagram @emily.sav

  - name: SAN Matcha
    category: casual
    address: Puebla 167, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    precision: approximate
    note: >
      Japanese tea and matcha, named as the best matcha of a whole slow travel
      trip and saved for the last day. Four branches in the city, including
      Polanco with a tatami room and a larger Condesa room made for sitting.
      The poster did not say which one, so this pin is the Roma Norte branch
      as the nearest. See docs/open-questions.md.
    source: instagram @emily.sav

  - name: Bobo Cafe
    category: casual
    address: Jalapa 110, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    precision: approximate
    note: >
      The mini pancake. One poster calls it a possible dupe for the Golden
      Diner pancake in New York, a commenter who has had both says it is good
      but three times thicker and without the crisp edges. Younger sibling of
      Bobo Burger. Listings give Jalapa 110 and Jalapa 111 for the Roma
      branch, and there are three others, so the pin is the right block
      rather than a confirmed door.
    source: instagram @bostoneatin, @emily.sav

  # Dinner and drinks
  - name: Sente
    category: fine
    protein: [beef]
    address: Avenida Mazatlan 81, Condesa, Cuauhtemoc, 06140 Ciudad de Mexico
    neighborhood: Condesa
    note: >
      Called the best dinner of an entire trip, for the steak and risotto main.
      Chef Rafael Juarez. Condesa, not Roma, whatever the post implies. One
      dissenting review had a tough cut and blamed luck. Rated 4.6 to 4.7 on
      OpenTable at the top price band, so this is a sit down dinner decision
      rather than a drop in.
    source: instagram @emily.sav

  - name: Choza
    category: casual
    address: Queretaro 11, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    precision: approximate
    note: >
      Thai influenced food and a listening bar, behind a doorway at number 11
      Queretaro that also hides two other restaurants and a bakery. Green
      curry with thin sliced beef and a pork pad thai with chili crisp are
      the two dishes shown. The hard part is getting in: reported walk in
      only, open Saturday, Sunday and Monday only, and one listing says it is
      not on Google at all. Address is from a 2021 article, so the pin is the
      block rather than the door.
    source: instagram @bostoneatin

  - name: Pistilo
    category: bar
    address: Calle Chiapas 208, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    neighborhood: Roma Norte
    precision: approximate
    note: >
      Mexican spirits, mezcal and natural pulque with house curados, built
      around art and conversation rather than music. There is no sign: the
      cues are a bat below the number 208 and a small green light saying it
      is open. Reported Wednesday to Monday 18:00 to 02:00, closed Tuesday.
      Standing room, so better for a few of us than for eight.
    source: instagram @mapaenmexico

  # Markets, from @insidetheupgrade's four market list
  - name: Bazar Sabado
    category: market
    address: Plaza San Jacinto, San Angel, Alvaro Obregon, Ciudad de Mexico
    neighborhood: San Angel
    precision: approximate
    note: >
      Saturdays only, which for this trip means 2 January. A colonial mansion
      full of crafts plus an art market filling the square outside. Flagged as
      the more touristy and more expensive of the two craft markets, and the
      poster bought two pieces in the square rather than inside. Hours differ
      by source between 09:00 and 19:00; mornings are the common advice.
      La Bombilla on the Insurgentes Metrobus, then about ten minutes on foot.
      The market is the mansion at number 11 plus the square plus the streets
      around it, and number 11 does not resolve on its own, so the pin is
      Plaza de San Jacinto itself. That is the right answer here rather than a
      compromise: on a Saturday the market is the square.
    source: instagram @insidetheupgrade

  - name: Mercado de Artesanias La Ciudadela
    category: market
    address: Plaza de la Ciudadela, Centro, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Centro
    precision: approximate
    note: >
      The same crafts as Bazar Sabado, more local and much cheaper, all under
      one roof: textiles, pottery, silver. Open daily, unlike Bazar Sabado,
      which makes this the one to default to. The street has no number, the
      entrance is at Balderas and Emilio Donde, and the postal code is given
      as both 06040 and 14060, so the pin is by name. Three minutes from
      Balderas metro on lines 1 and 3.
    source: instagram @insidetheupgrade

  - name: Mercado de La Merced
    category: market
    address: Mercado Merced, Venustiano Carranza, Ciudad de Mexico
    neighborhood: La Merced
    precision: approximate
    note: >
      The largest and oldest market in the city, and described as completely
      overwhelming in the best way. Loud and crowded; the chili stalls are the
      thing not to skip. No street number in any listing, so the pin is by
      name. Metro Merced on line 1. Opens around 06:00, closes 18:00 or 19:00.
      This is a long way east of everything else on this page, so it is a
      morning of its own rather than something to fold into another day.
    source: instagram @insidetheupgrade

  # Shops and green space
  - name: Proyecto Rufina
    category: spot
    address: Jalapa 129, Roma Norte, Cuauhtemoc, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Clothing and homeware from Mexican artisans and designers, on a fair
      wage basis. Named as one of only two shops worth it out of a whole trip
      by a poster who was otherwise unimpressed by shopping here. A second
      branch at Amsterdam 133 in Condesa. Same street as Bobo Cafe.
      Number 129 resolves exactly, though OpenStreetMap still labels that door
      a hair salon, so the pin is the right address under a stale name.
    source: instagram @emily.sav

  - name: Bosque de Chapultepec
    category: spot
    address: 1a Seccion del Bosque de Chapultepec, Miguel Hidalgo, Ciudad de Mexico
    neighborhood: Chapultepec
    precision: approximate
    note: >
      Named on a resident's short list of where to send a first time visitor,
      alongside things already on this page. The park is enormous and has
      three sections, so this pin is the middle of the first section, which is
      the one everybody means: Antropologia, the Castillo and the lake are all
      in it, and the Reforma entrance is its east edge. Asking the geocoder
      for the park by name alone returned the second section instead, two and
      a half kilometres further west and past everything worth walking to, so
      the section is named in the address on purpose. This is a pin for an
      area, not a door.
    source: instagram @deccadotcom

  - name: Tetetlan
    category: spot
    address: Avenida de las Fuentes 180, Jardines del Pedregal, Alvaro Obregon, 01900 Ciudad de Mexico
    neighborhood: Jardines del Pedregal
    note: >
      A restaurant, shop and free architecture library in the former stables
      of Luis Barragan's Casa Pedregal, built over the volcanic rock the
      neighbourhood is named for. Casa Pedregal itself is next door and can be
      toured by reservation. The only entry on a resident's first visit list
      that was not already here. Listed as both 180 and 180-B. One roundup
      gives Periferico 3720, which looks like a stale listing. Reported open
      from 07:30 to about 23:00 daily. Deep south, about as far as
      Xochimilco, so it pairs with Coyoacan or San Angel rather than standing
      alone.
    source: instagram @deccadotcom
