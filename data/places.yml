  - name: Panaderia Rosetta
    category: casual
    address: Panaderia Rosetta, Colima 179, Roma Norte, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      The bakery arm of Rosetta. Guava roll is the thing. Named again by two
      more reels, one calling it the best bakery in the city. One of those two
      was unconvinced by the guava pastries, so it is not unanimous.
      A friend in the city in November named it unprompted and specified the
      guava roll, which breaks that tie in favour of ordering it.
      That tie is back. Two more posters in the November batch specifically
      did not get the guava hype, one preferring the vanilla concha here and
      the other the pan de muerto made with corn leaf ash. A third says locals
      dislike this place and Odette both. So: go, because nobody disputes the
      bakery, but order the concha as well as the guava roll and settle it
      ourselves.
    source: instagram @thatonepointofview, @thecaroandtina, @stepbysteph.traveltips, @bostoneatin, @dfgmuyjvbqg

