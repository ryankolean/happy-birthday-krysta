  - name: Mercado Medellin
    category: market
    address: Campeche 101, Roma Sur, Mexico City
    neighborhood: Roma Sur
    note: About a ten minute walk. Open 8 AM to 7 PM, fondas busiest noon to 3 PM.

  # ---------- bars ----------
  - name: Limantour
    category: bar
    address: Avenida Alvaro Obregon 106, Roma Norte, Mexico City
    neighborhood: Roma Norte
    note: Number 20 on Mexico's 50 Best. The 29 December drinks pick.

  - name: Rayo
    category: bar
    address: Rio Panuco 128, Cuauhtemoc, Mexico City
    neighborhood: Cuauhtemoc
    note: Caps at 8, confirmed. Wednesday to Saturday, 6 PM to 1:15 AM. 55 6385 2051.

  - name: Handshake Speakeasy
    category: bar
    address: Amberes 65, Juarez, Mexico City
    neighborhood: Juarez
    note: Longest booking lead time of any bar on the list. Establish it early.

  - name: Gin Gin Cibeles
    category: bar
    address: Oaxaca 87, Roma Norte, Mexico City
    neighborhood: Roma Norte
