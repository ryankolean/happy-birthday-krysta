# Every place we might eat, drink, or go, plus where we are staying.
#
# TO ADD A PLACE: append an entry with at minimum `name`, `category` and
# `address`, then run `npm run geocode` to fill in lat/lon, then `npm run build`.
# Entries that already have coordinates are left alone.
#
# category must be one of the keys in `categories` below.
# precision: exact | approximate   (approximate draws a hollow marker)
#
# url, links:
#   Where to look the place up. `url` is the main one and `links` is a list of
#   any others: their own site, their Instagram, wherever they take bookings,
#   or the write up an entry came from. The label under each link on the map is
#   worked out from the host, so nothing needs naming here. Every pin also gets
#   a generated Google Maps search whether or not either key is set, so no pin
#   is ever a dead end; the stay pin is the one exception, because a map search
#   on its address would undo the point of a deliberately vague pin.
#
# michelin: 1 | 2 | 3 | bib | listed
#   What the Michelin guide itself says, read off guide.michelin.com, not what
#   a restaurant or a reel claims about itself. A number is stars and draws
#   that many stars on the pin. `bib` is a Bib Gourmand and `listed` means in
#   the guide without either, both of which show in the popup and the table but
#   not on the pin.
#
#   Checked against the guide's whole Mexico selection on 10 November 2026,
#   every entry it lists in the Mexico City boroughs and in Puerto Morelos, so
#   no key now means the guide does not list the place. Redo it the same way
#   rather than from a news story: the per distinction lists at
#   /en/mx/restaurants/1-star-michelin, /2-stars-michelin and /bib-gourmand are
#   complete and short, while the unfiltered list pages shuffle between
#   requests and need fetching several times over to cover everything.
#   Distinctions move every year. El Califa de Leon had a star in 2024 and does
#   not now.
#
# protein: [seafood, beef, pork, chicken]
#   What the kitchen is known for, not everything it serves. One badge per
#   protein on the pin, so set this only where the note already says what the
#   order is. A scalar works too: `protein: seafood`.

categories:
  stay:
    label: Where we are staying
    color: "#C06A05"
  fine:
    label: Fine dining
    color: "#0F5C57"
  casual:
    label: Casual food
    color: "#2E8B6F"
  bar:
    label: Bars and drinks
    color: "#6B4E9E"
  market:
    label: Markets and food pickup
    color: "#B5541F"
  taco:
    label: Tacos and street food
    color: "#C23B22"
  spot:
    label: Parks, shops and sights
    color: "#4A6FA5"

