  # Tacos and street food
  - name: Tacos del Valle
    category: taco
    address: Tacos del Valle, Ciudad de Mexico
    note: >
      Rated 9/10 by @placesnoted and starred by @thatonepointofview as actually
      eaten. Trompo-style pastor over open flame. The one where the hype and the
      plate agree. Three trompos, spicy pork, pork belly and carne asada, but the
      pick is the steak and bone marrow taco. Expect a long line.
    source: instagram @placesnoted, @thatonepointofview, @thecaroandtina

  - name: Tacos La Once Mil
    category: taco
    lat: 19.4199507
    lon: -99.160306
    address: Tacos La Once Mil, Roma Norte, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Rated 10/10. Wood-fired Wagyu, filet mignon and Prime skirt, tortillas
      made to order, spicy tuna tostada. Pricier than a normal taqueria. Billed
      as the only Michelin-starred taqueria in Mexico. The wagyu taco is the one
      to order and the picanha off the trompo is skippable.
    source: instagram @placesnoted, @thecaroandtina

  - name: Tacos Atarantados
    category: taco
    address: Tacos Atarantados, Ciudad de Mexico
    note: Rated 8.5/10. Al pastor over real charcoal, which is rarer than it should be here.
    source: instagram @placesnoted

