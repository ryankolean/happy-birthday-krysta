    address: Merida 83, Roma Norte, Cuauhtemoc, 06700 Ciudad de Mexico
    note: >
      Blue corn tortillas pressed to order on a comal in the street. The order
      is the mole verde chicken. A late night line is reported to look worse
      than it is and to move much faster than the one at Odette.
    source: instagram @thatonepointofview, @itsalanbarr, @bostoneatin

  - name: Mi Compa Chava
    category: casual
    protein: [seafood]
    address: Mi Compa Chava, Roma Norte, Ciudad de Mexico
    neighborhood: Roma Norte
    note: >
      Sinaloan seafood. Was already on Krysta's own list. A third poster called
      it the best stop of their whole trip, for the seafood tower, the aguachiles
      and the tuna tostada.
      A friend in the city in November named the same two dishes unprompted,
      the torre de mariscos and the aguachile, and said most any seafood here
      is good. Four independent sources on the same two orders is as settled
      as anything on this page gets.
      A fifth went twice in one week and waited an hour and a half, naming the
      grilled shrimp and the scallop tostada on top of the tuna tostada. Two
      practical notes from that thread: weekends are the worst of it, and you
      can wait in the courtyard with a beer rather than on the street. Also on
      the tuna tostada tour below, which makes it the only place that appears
      on both the seafood roster and everybody's general list.
    source: instagram @thatonepointofview, @itsalanbarr, @thecaroandtina, friend in Mexico City, November 2026

