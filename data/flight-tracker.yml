# What to ask each person for. Keep it to this list: it is everything needed to
# coordinate a pickup and nothing that should not be in a git repository.
collect_from_everyone:
  - Airline and flight number for each leg
  - Date of each leg
  - Airport codes, origin and destination, because MEX and NLU are both Mexico City
  - Scheduled departure time, local to the departure airport
  - Scheduled arrival time, local to the arrival airport
  - Whether the booking is ticketed or still a hold
  - Do not ask for confirmation numbers in a group thread

# Why the Cancun leg is worth coordinating rather than leaving to each person.
coordination:
  mex_cun_2027_01_03: >
    Six people are on this leg and it is the one that pays to share. One
    arrival at CUN means one transfer and one van to Puerto Morelos instead of
    six people trickling in across the afternoon. Aeromexico runs it roughly
    hourly at a flat fare, so the departure time is a group decision and not a
    price decision. The 13:55 is the current pick because it leaves after the
    11:00 Casa KM checkout.
  mex_cun_baggage: >
    Tell everybody the same two things before they book, because the default
    choice is the wrong one. Buy the Basic fare, not the cheapest one shown.
    The cheapest fare is Light, and it carries no checked bag and no carry-on
    at all, so it strands you with a personal item on the way to a five night
    beach stay. Then buy the checked bag online before check-in, at 500 MXN,
    roughly 27 USD. It costs more at the airport.
    Basic plus a bag is about 222 per person. The first fare that bundles a
    bag is Flex at 262, so buying the bag separately saves about 40 each and
    242 across the six. Nobody should rely on Ryan's Delta status here:
    Aeromexico excludes Basic purchases on domestic routes from SkyTeam and
    Delta member baggage benefits. Full working in data/flights.yml under
    the to_beach leg.
  dtw_mex_2026_12_29: >
    Do not try to put the group on one booking. The Delta nonstop will not
    sell to a party of five or more in a single transaction, and every
    passenger added prices the whole booking at the highest bucket reached.
    Book in pairs against the same flight number. See party_size_ceiling in
    data/flights.yml.

