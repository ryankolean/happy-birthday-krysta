# Who is actually on which flight, and what time it is on the local clock at
# each end. The shared group legs live in data/flights.yml. This file records
# bookings per traveller group so arrivals can be coordinated.
#
# NEVER PUT IN THIS FILE: confirmation numbers, record locators, ticket
# numbers, full legal names, dates of birth, passport numbers, SkyMiles or
# other loyalty numbers, seat assignments tied to a named person. Those go in
# private/, which is gitignored. Point at the private file by name instead,
# the way the hosts entry does.
#
# Flight numbers, airports, dates and times are fine here. They are published
# schedule facts, not personal data.

updated: 2026-11-01

# Local clock at each airport for this trip's dates.
#
# Mexico City runs UTC-6 all year and does not observe DST.
# Cancun runs UTC-5 all year and does not observe DST.
# Detroit in late December and early January is on EST, which is UTC-5.
#
# So DTW and CUN share a clock for this whole trip, and Mexico City sits one
# hour behind both. That is why the outbound looks like a 3h50 flight on the
# clock when it is actually 4h50 in the air, and why the Cancun return's clock
# time and elapsed time agree.
timezones:
  DTW:
    tz: America/Detroit
    offset_on_trip: "-05:00"
    note: EST in December and January, DST is not in effect
  MEX:
    tz: America/Mexico_City
    offset_on_trip: "-06:00"
    note: no DST, UTC-6 all year since 2022
  CUN:
    tz: America/Cancun
    offset_on_trip: "-05:00"
    note: no DST, UTC-5 all year

