# What to ask each person for. Keep it to this list: it is everything needed to
# coordinate a pickup and nothing that should not be in a git repository.
collect_from_everyone:
  - Airline and flight number for each leg
  - Date of each leg
  - Airport codes, origin and destination, because MEX and NLU are both Mexico City
  - Scheduled departure time, local to the departure airport
  - Scheduled arrival time, local to the arrival airport
  - Whether the booking is ticketed or still a hold
  - Do not ask for confirmation numbers in a group thread

# Why the Cancun leg is worth coordinating rather than leaving to each person.
coordination:
  mex_cun_2027_01_03: >
    Six people are on this leg and it is the one that pays to share. One
    arrival at CUN means one transfer and one van to Puerto Morelos instead of
    six people trickling in across the afternoon. Settled on 1 November: the
    14:55, landing 18:36. Aeromexico runs the route roughly hourly at a flat
    fare, so the time was never a price decision, but it turned out to be a
    baggage one. AM Plus is the only fare family here that includes a checked
    bag and it is not sold on the 13:55, which was the earlier pick.
  mex_cun_baggage: >
    Book the 14:55 and buy AM Plus Classic, 260.25. Not the cheapest fare
    shown, and not Main Cabin at all.
    The reason is baggage. No Main Cabin fare on this route includes a checked
    bag. Not Basic, not Classic, and not Flex, which is the expensive one.
    Every one of them charges for it separately, so the real Main Cabin price
    is 223.15 plus about 27 for a bag bought online, roughly 250. AM Plus
    Classic is 260.25 with the bag and an extra-legroom seat already in it.
    Ten dollars, and nothing left to buy at the airport.
    Do not be tempted by the cheapest fare on the page. That is Light, and it
    carries no checked bag and no carry-on at all, not even a bin item, which
    strands you with a personal item on the way to a five night beach stay.
    AM Plus is not sold on the 13:55, which is why the group moved an hour
    later. Nobody should rely on Ryan's Delta status here: Aeromexico excludes
    Basic purchases on domestic routes from SkyTeam and Delta member baggage
    benefits. Full working in data/flights.yml under the to_beach leg.
  mex_2026_12_29_arrivals: >
    Two arrivals at MEX Terminal 2 within fifteen minutes of each other on
    29 December: Krysta and Ryan at 12:30 on DL 646 from Detroit, Christian at
    12:45 on DL 7952 from Los Angeles. Three people, one ride into the city.
    Whoever books that transfer should book it once, for 13:30 or later, and
    not twice.
  lax_origin: >
    Christian is the only one flying from Los Angeles, confirmed 5 November
    2026 when he reported his flights. That closes an open question this repo
    carried from the start. It changes nothing about the shared legs: he joins
    the group at Mexico City on 29 December and leaves it at Cancun on
    8 January, and the AM 536 hop in between is the same aircraft as everyone
    else. It does mean the DTW advice in this file does not apply to him and
    that the 1,880.25 reference figure never did.
  cun_dtw_2027_01_08: >
    Four of the group are on the same flight home. Krysta, Ryan, Haley and
    Eddie are all on DL 1911 out of Cancun at 15:15 on 8 January, landing
    Detroit 19:12, and all four are in Delta First. One check-in time, one
    security queue, one ride from DTW. Whoever arranges a car home should book
    one vehicle for four people and not two.
    Christian is not on it. He leaves Cancun at 13:50 on DL 641 and routes
    home through Atlanta to Los Angeles, so he goes to the airport earlier.
    Bubba has not reported anything yet, and the obvious thing is to put him
    on DL 1911 with the other four while there are still seats.
  dtw_mex_2026_12_29: >
    Do not try to put the group on one booking. The Delta nonstop will not
    sell to a party of five or more in a single transaction, and every
    passenger added prices the whole booking at the highest bucket reached.
    Book in pairs against the same flight number. See party_size_ceiling in
    data/flights.yml.

# Fare tracking after purchase. A drop only turns into money if the ticket
# rules allow a reprice. That is true of the Delta record and not true of the
# Aeromexico one, so check the rule before spending time on a claim.
price_watch:
  as_of: 2026-11-05
  why: >
    Both Delta tickets are Main Cabin or above and carry no change fee, so a
    later drop on the same itinerary can be collected by reissuing the ticket,
    with the old ticket's value carried across as an eCredit. The Aeromexico
    fare is AM Plus Classic, where free changes only start one tier up at
    Flex, so a drop there is swallowed by the change fee.
    This worked once already, on 5 November. Keep watching: there is no fee
    for looking and the ticket is changeable until departure.

  claimed:
    - on: 2026-11-05
      what: >
        The DTW to MEX fare dropped 222.00 for the two of them between
        1 and 5 November, taxes unchanged at 380.54. Rather than take the
        drop as an eCredit and keep Comfort, the record was reissued into
        Delta First on the Cancun to Detroit leg, which absorbed the drop.
        Net new money 298.00 for two, against 620.00 for the same upgrade
        bought without a drop to spend. Delta publishes no price-adjustment
        process and matches nothing automatically, so this only happened
        because somebody looked.
      watch_out: >
        A reissue mints a new record locator and new ticket numbers, and it
        releases the seats on the old record. The replacement record came
        back with an auto-assigned pair on the outbound that was not two
        together and nothing at all on the way home. Both legs were
        reselected by hand on 5 November. Check the seat map after any
        reissue rather than assuming the old seats carried across.

  baselines:
    delta_both_legs:
      per_person_usd: 1697.27
      total_usd: 3394.54
      status: paid
      booked_on: 2026-11-01
      reissued_on: 2026-11-05
      route: DTW to MEX on 2026-12-29, CUN to DTW on 2027-01-08
      cabin: Delta Comfort Classic out fare class S, Delta First Classic home fare class I
      watch: yes
      act_above_usd: 25
      act_note: >
        Per person. Below about 25 the reissue costs more time than the
        eCredit is worth, though there is no fee for trying.
    mex_cun:
      per_person_usd: 260.25
      status: paid
      ticketed: 2026-11-03
      route: MEX to CUN on 2027-01-03, the 14:55
      fare: AM Plus Classic
      watch: no
      rechecked: 2026-11-03
      recheck_note: >
        Re-priced on aeromexico.com on 3 November, two days after the fare
        was first recorded, and the whole ladder on this flight is identical:
        Main Light 199.95, Main Basic 223.15, Main Classic 242.85, Main Flex
        302.05, AM Plus Classic 260.25, AM Plus Flex 331.05. Still nothing
        below AM Plus that includes a checked bag, so the 17.40 over Main
        Classic still buys the extra-legroom seat rather than the bag.
        AM Plus Classic was then bought at that 260.25 the same morning, so
        this ladder is the price that was paid rather than a quote still
        standing.
      why_not: >
        Free changes begin at AM Plus Flex, one tier above what was bought.
        A drop is offset by the change fee, and Aeromexico does not reprice
        as a goodwill gesture the way a Delta agent will.

  how_to_claim: see docs/price-drops.md

  alerts: >
    Google Flights price tracking on both Delta dates, emailed to Ryan. It is
    free and does not depend on scraping either airline. Delta and Aeromexico
    both sit behind bot protection, Akamai and RiskX on the Aeromexico
    booking flow, so a checker running in CI would break rather than quietly
    keep working. Do not build one.

