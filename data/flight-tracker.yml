# What a seat should cost somebody booking now. Nobody owes this to anybody:
# everyone books and pays for their own flights. These are reference figures
# so people can sanity check a quote before they buy, and so the trip has an
# honest running total.
pricing_reference:
  as_of: 2026-11-01
  status: quoted
  beach_bound_reference:
    per_person_usd: 1842
    legs:
      out: 1056          # DTW to MEX, Delta Main Classic, next bucket up
      to_beach: 222      # Aeromexico Basic plus a prepaid checked bag
      home: 564          # CUN to DTW, Delta Main Classic, DL 1911
  city_only_reference:
    status: retired
    note: >
      There was a Mexico City only reference here, at 2,949, built on a MEX to
      DTW nonstop priced in September and never rechecked. It is gone because
      the only person it applied to is arranging their own flights, so nobody
      needs the figure. If somebody else ends up flying home after the city,
      reprice that leg from scratch rather than reviving 1,893.
  the_890_is_gone: >
    Every earlier version of this plan quoted 1,056 as the fallback and 890 as
    the price. The 890 bucket on DL 646 had exactly two seats left on
    2026-11-01 and Ryan and Krysta took both. 1,056 per person is what the
    same search returned at four passengers, so it is the realistic floor for
    anybody booking now, and it will drift up as the date closes. Treat it as
    a floor, not a quote.
  bags: >
    Add nothing for bags on the Delta legs if you hold Medallion status.
    Without status, add 45 on the outbound and 46 on the way home, so 91 per
    person. The Aeromexico bag is already inside the 222.
  what_hosts_paid: >
    1,770.27 per person, of which 1,548.27 is paid and 222 is the Cancun hop
    they have not bought. They are above the reference because they chose
    Delta Comfort for the legroom rather than Main.

pricing_rollup:
  as_of: 2026-11-01
  travellers_tracked: 6
  travellers_self_arranged: 1
  paid_so_far_usd: 3096.54
  expected_remaining_usd: 7812.00
  expected_trip_total_usd: 10908.54
  note: >
    Air only, across the six whose flights this trip coordinates, assuming
    everybody still to book buys Main Classic and takes the Cancun hop. The
    seventh traveller arranges their own flights, so they are not in this
