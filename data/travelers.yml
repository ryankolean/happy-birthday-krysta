# Lodging was always decided by the bed configuration rather than by price.
# Three couples plus one single needed three double beds in three separate
# rooms. Two couples plus two singles needs only two, because a single will
# take any room with any bed, which is why cheaper options qualified once the
# group changed shape.
bed_requirement:
  couples: 2
  singles: 2
  rule: the two singles need separate rooms, not a shared twin room
  satisfied_by: >
    Casa KM has four bedrooms, each with its own full bathroom. The couples
    take the king and a queen, the singles take the other queen and the full.

# Which named individual sits in which role is deliberately not recorded here.
# That mapping lives in private/, along with who is paying for what.
settled:
  - >
    Which of the seven books their own hotel in the city: Matthew, role
    solo_b, confirmed 1 November 2026. He arranges his own flights and his own
    room, and settles only the shared events and meals with Ryan. Casa KM
    therefore splits 6 ways, which is what data/budget.yml has always assumed.

open:
  - >
    Who flies from DTW. Christian is the LAX origin, confirmed
    5 November 2026 when he reported his flights, and he is the only
    one. Everybody else is assumed Detroit until they say otherwise.
  - Collect a deposit per person before the 14 December Casa KM payment
