# Roles only. Real names and contact details stay in private/, never here.
#
# Headcount settled 19 October 2026 after two changes: the group went 8 to 7
# in Mexico City when one half of a couple dropped, and the beach leg is
# confirmed to stay at 6.

headcount:
  cdmx: 7
  riviera: 6
  sharing_casa_km: 6
  note: >
    Seven in Mexico City. Six of them share Casa KM as two couples and two
    singles; the seventh books their own hotel in the city. Six go on to the
    Riviera Maya, so exactly one of the seven flies home after Mexico City.

groups:
  - id: hosts
    label: Ryan and Krysta
    size: 2
    legs: [cdmx, riviera]
    room: private

  - id: couple_a
    label: Couple A
    size: 2
    legs: [cdmx, riviera]
    room: private

  - id: single_a
    label: Single friend A
    size: 1
    legs: [cdmx, riviera]
    room: private

  - id: single_b
    label: Single friend B
    size: 1
    legs: [cdmx, riviera]
    room: private

  - id: solo_b
    label: Solo traveller B
    size: 1
    legs: [cdmx]
    former_id: couple_b
    note: >
      Was Couple B until one of the two dropped on 12 October. Flies home from
      Mexico City on 3 January, so this is the one person not on the beach leg.

# Lodging was always decided by the bed configuration rather than by price.
# Three couples plus one single needed three double beds in three separate
# rooms. Two couples plus two singles needs only two, because a single will
# take any room with any bed, which is why cheaper options qualified once the
# group changed shape.
bed_requirement:
  couples: 2
  singles: 2
  rule: the two singles need separate rooms, not a shared twin room
  satisfied_by: >
    Casa KM has four bedrooms, each with its own full bathroom. The couples
    take the king and a queen, the singles take the other queen and the full.

# Which named individual sits in which role is deliberately not recorded here.
# That mapping lives in private/, along with who is paying for what.
open:
  - Confirm which of the seven is booking their own hotel in the city
  - Who flies from DTW and whether anyone is coming from LAX
  - Collect a deposit per person before the 14 December Casa KM payment
  - Solo traveller B needs to confirm their own return routing from MEX
